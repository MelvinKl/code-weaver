      # GITHUB_ENV from the trigger artifact (Read trigger state)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The file IS its runtime tree: stage 1 materialised the workflow
        # file's embedded runtime tree into $RUNNER_TEMP/cw/stash and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's resolved config
        # alongside it — before any checkout replaces the workspace. No
        # second ref to pin, clone or bump: the consumer's uses: line is
        # the only version selection a run makes. The resolved config keeps
        # riding the ARTIFACT (the job-outputs relay has been observed
        # dropping a value for one downstream job while the next received
        # it): the Read trigger state step below feeds GITHUB_ENV from the
        # restored state files.
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw

      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - name: Stage 4 — extract the delta requirements (Gherkin)
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - name: Requirement-extraction loop (bounded by MAX_LOOPS; 0 = no cap)
        if: ${{ env.CW_STARTED == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        # The stage script runs from the stash — the runtime tree this
        # job's first step copied from the called repo at the called ref,
        # before the stage's checkout replaced the workspace with the target.
        run: |-
          S="$RUNNER_TEMP/cw/stash/.github/actions/extract-stage/stage.py"
          [ -f "$S" ] || { echo "::error::stashed stage script $S is missing — the stash step did not run before this step"; exit 1; }
          python3 "$S"
      - name: Push the AI branch
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${AI_BRANCH}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-extract
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
          include-hidden-files: true

  # ── stages 6+7 ─────────────────────────────────────────────────────────
