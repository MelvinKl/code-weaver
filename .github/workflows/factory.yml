          # value to the next step via the step's own outputs (a GITHUB_ENV
          # write is not that build's reliable channel; see the baseline job)
          if ctx:
              with open(os.environ.get("GITHUB_OUTPUT", os.devnull), "a") as f:
                  f.write("context=" + " ".join(p for _, p in ctx) + "\n")
          print(f"pr-body prompt ready: {len(ctx)} context file(s)")
          EOF
        env:
          CW_ISSUE: ${{ env.CW_ISSUE_NUMBER }}
          CW_TITLE: ${{ env.CW_ISSUE_TITLE }}
          CW_TARGET: ${{ inputs.target-branch }}
          REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
          PLAN_DIR: ${{ inputs.plan-dir }}
