          if-no-files-found: ignore
          include-hidden-files: true

  # ── stages 8+9 ─────────────────────────────────────────────────────────
  implement:
    name: "8-9 implementation (+ guard; a requirement edit is repaired in place)"
    needs: plan
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
      PLAN_DIR: ${{ inputs.plan-dir }}
      DOC_DIR: ${{ inputs.doc-dir }}
      LLM_MODEL: ${{ inputs.llm-model }}
      MAX_LOOPS: ${{ inputs.max-loops }}
