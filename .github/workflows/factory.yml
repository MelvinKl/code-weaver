        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-setup
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
