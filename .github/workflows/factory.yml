  # ── stages 6+7 ─────────────────────────────────────────────────────────
  plan:
    name: "6-7 planning (+ guard)"
    needs: extract
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
