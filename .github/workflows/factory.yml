    needs: implement
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
      PLAN_DIR: ${{ inputs.plan-dir }}
      DOC_DIR: ${{ inputs.doc-dir }}
      LLM_MODEL: ${{ inputs.llm-model }}
      MAX_LOOPS: ${{ inputs.max-loops }}
      # ISSUE_NUMBER / AI_BRANCH / BASELINE_REF arrive via
      # GITHUB_ENV from the trigger artifact (Read trigger state)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The runner has checked out THIS repo at the called ref into the
        # workspace (that is how it obtained this workflow file); the stage
        # checkouts below replace it with the TARGET repo, which holds no copy
        # of the factory's runtime tree. So the tree the inlined stage steps
        # execute (the .github scripts, the stage scripts, the pi prompt
        # templates) is copied to $RUNNER_TEMP first — RUNNER_TEMP survives
        # every later checkout, and the repo-relative layout is preserved, so
        # the scripts' __file__-relative imports keep resolving. Same-repo and
        # cross-repo runs take this one identical path: no GITHUB_ACTION_PATH
        # guessing, no action boundary, no own-action refs.
        run: |
          [ -d .github ] || { echo "::error::no .github at the workspace root — the called-repo checkout the runner should have made is missing; the factory runtime tree cannot be stashed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cw/stash"
          cp -r .github "$RUNNER_TEMP/cw/stash/"
          if [ -d pi-prompts ]; then cp -r pi-prompts "$RUNNER_TEMP/cw/stash/"; fi
          echo "stashed the factory runtime tree to $RUNNER_TEMP/cw/stash (.github: $(find "$RUNNER_TEMP/cw/stash/.github" -type f | wc -l) files)"
      # Value source — the trigger's resolved config rides the ARTIFACT:
      # the job-outputs relay has been observed dropping a value for one
      # downstream job while the next job received it (issue-number present
      # in baseline, missing in extract). The artifact is the oracle's
      # stage-results channel; GITHUB_ENV then feeds the rest of the job.
      - name: Stage state — trigger
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-implement
          path: ${{ runner.temp }}/cw
      - name: Stage 10-11 — run the oracle, review, fix (bounded loop)
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - name: Test & review loop (bounded by MAX_LOOPS; 0 = no cap)
        if: ${{ env.CW_STARTED == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        # The stage script runs from the stash — the runtime tree this
        # job's first step copied from the called repo at the called ref,
        # before the stage's checkout replaced the workspace with the target.
        run: |-
          S="$RUNNER_TEMP/cw/stash/.github/actions/review-stage/stage.py"
          [ -f "$S" ] || { echo "::error::stashed stage script $S is missing — the stash step did not run before this step"; exit 1; }
          python3 "$S"
      - name: Push the AI branch
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${AI_BRANCH}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-review
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore

  # ── stage 12 ───────────────────────────────────────────────────────────
  pr:
    name: "12 open the pull request (its body = the status report)"
    needs: [trigger, baseline, review]
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CW_BASE: ${{ inputs.target-branch }}
      # CW_HEAD / CW_TITLE / CW_ISSUE_NUMBER / AI_BRANCH / ISSUE_NUMBER
      # arrive via GITHUB_ENV from the trigger artifact (Read trigger state)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The runner has checked out THIS repo at the called ref into the
        # workspace (that is how it obtained this workflow file); the stage
        # checkouts below replace it with the TARGET repo, which holds no copy
        # of the factory's runtime tree. So the tree the inlined stage steps
        # execute (the .github scripts, the stage scripts, the pi prompt
        # templates) is copied to $RUNNER_TEMP first — RUNNER_TEMP survives
        # every later checkout, and the repo-relative layout is preserved, so
        # the scripts' __file__-relative imports keep resolving. Same-repo and
        # cross-repo runs take this one identical path: no GITHUB_ACTION_PATH
        # guessing, no action boundary, no own-action refs.
        run: |
          [ -d .github ] || { echo "::error::no .github at the workspace root — the called-repo checkout the runner should have made is missing; the factory runtime tree cannot be stashed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cw/stash"
          cp -r .github "$RUNNER_TEMP/cw/stash/"
          if [ -d pi-prompts ]; then cp -r pi-prompts "$RUNNER_TEMP/cw/stash/"; fi
          echo "stashed the factory runtime tree to $RUNNER_TEMP/cw/stash (.github: $(find "$RUNNER_TEMP/cw/stash/.github" -type f | wc -l) files)"
      # Value source — the trigger's resolved config rides the ARTIFACT:
      # the job-outputs relay has been observed dropping a value for one
      # downstream job while the next job received it (issue-number present
      # in baseline, missing in extract). The artifact is the oracle's
      # stage-results channel; GITHUB_ENV then feeds the rest of the job.
      - name: Stage state — trigger
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-setup
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-extract
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-plan
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-implement
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        with:
          name: cw-review
          path: ${{ runner.temp }}/cw
      - id: prepare-body
        name: Prepare the PR-body prompt (issue meta + the context file list)
        run: |
          python3 - "$RUNNER_TEMP/cw" <<'EOF'
          import glob, os, sys
          cw = sys.argv[1]
          issue = os.environ.get("CW_ISSUE", "?")
          title = os.environ.get("CW_TITLE", "")
          target = os.environ.get("CW_TARGET", "main")
          repo = os.environ.get("GITHUB_WORKSPACE", ".")
          ctx = []
          req = os.path.join(repo, os.environ.get("REQUIREMENTS_DIR", "requirements"))
          if os.path.isdir(req):
              for f in sorted(glob.glob(os.path.join(req, "**", "*.feature"), recursive=True)):
                  ctx.append(("the Gherkin oracle (requirements/)", f))
          plan = os.path.join(repo, os.environ.get("PLAN_DIR", "plans"),
                              f"{issue}.md")
          if os.path.isfile(plan):
              ctx.append(("the plan for this issue", plan))
          for f in (os.path.join(cw, "pi-review.md.out"),):
              if os.path.isfile(f):
                  ctx.append(("the review (per-scenario verdicts)", f))
          for pat in ("review-iteration-*.md", "test-run-*.txt"):
              for f in sorted(glob.glob(os.path.join(cw, pat))):
                  ctx.append(("the review (iteration log / test output)", f))
          prompt = ["# PR body target",
                    f"- Issue: #{issue} — {title}",
                    f"- Target branch the PR opens against: {target}",
                    "- Write the COMPLETE pull request body (markdown) to:",
                    f"    {os.path.join(cw, 'pr-body.md')}",
                    "",
                    "The context files the pi call carries (read the ones you need):"]
          for role, p in ctx:
              prompt.append(f"- {role}: {p}")
          open(os.path.join(cw, "pr-prompt.md"), "w").write("\n".join(prompt) + "\n")
          # the space-separated context list — this runner build relays a
          # value to the next step via the step's own outputs (a GITHUB_ENV
          # write is not that build's reliable channel; see the baseline job)
          if ctx:
              with open(os.environ.get("GITHUB_OUTPUT", os.devnull), "a") as f:
                  f.write("context=" + " ".join(p for _, p in ctx) + "\n")
          print(f"pr-body prompt ready: {len(ctx)} context file(s)")
          EOF
        env:
          CW_ISSUE: ${{ env.CW_ISSUE_NUMBER }}
          CW_TITLE: ${{ env.CW_ISSUE_TITLE }}
          CW_TARGET: ${{ inputs.target-branch }}
          REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
          PLAN_DIR: ${{ inputs.plan-dir }}
      - id: gen-body
        env:
          CW_MODEL: ${{ inputs.llm-model }}
          CW_TEMPLATE: pr-body
          CW_PROMPT_FILE: ${{ runner.temp }}/cw/pr-prompt.md
          CW_CONTEXT: ${{ steps.prepare-body.outputs.context }}
        name: Generate the PR body with pi (from the requirements, the plan and the review)
        shell: /usr/bin/env python3 {0}  # bare "python3" is not a runner-accepted shell form
        working-directory: ${{ github.workspace }}
        run: |
          try:
              import os, sys
              action_dir = os.path.join(os.environ.get("RUNNER_TEMP", ""), "cw", "stash", ".github", "actions", "pi-run")
              scripts = os.path.join(os.path.dirname(os.path.dirname(action_dir)), "scripts")
              if os.path.isdir(scripts):
                  sys.path.insert(0, scripts)
              # a crashed stage must leave a persistent diagnosis (the job log dies
              # with the run; a ghost run's logs are unreachable from the API) —
              # the full traceback goes to the runner's diag dir + one line to the
              # stage-fail-reason state file the summary/upload steps carry on
              def _cw_persist(stage, dump, value):
                  # one writer for both paths (the explicit try/except wrap and the
                  # excepthook) — the job-visible ::error:: line, the stage-fail-reason
                  # state file (carried on by the summary/upload steps), and the
                  # runner's durable diag log (the job log dies with the run)
                  if globals().get("_cw_persisted"):
                      return
                  globals()["_cw_persisted"] = True
                  try:
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                          f.write(f"stage {stage} FAILED — {value}\n")
                      with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                          f.write(f"=== stage {stage} FAILED ===\n{dump}\n")
                      print(f"::error::stage {stage} failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
                  except Exception:
                      print(f"::error::stage {stage} failed — {value}")

              def _cw_on_uncaught(t, v, tb):
                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("pi-run (LLM stages)", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              from common import pi_invoke, state_file
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              def _cw_in_opt(name):
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  return None

              prompts = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(action_dir))), "pi-prompts")
              template = _cw_in("template")
              sp = os.path.join(prompts, template + ".md")
              if not os.path.exists(sp):
                  print(f"::error::unknown pi prompt template '{template}' (have: "
                        f"{sorted(os.path.basename(p) for p in os.listdir(prompts)) if os.path.isdir(prompts) else 'none'})")
                  sys.exit(1)
              r = pi_invoke(
                  model=_cw_in("model"),
                  system_prompt_file=sp,
                  prompt_file=_cw_in_opt("prompt-file"),
                  context=(_cw_in_opt("context") or "").split(),
                  timeout=int(_cw_in_opt("timeout") or 1800),
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"pi-exit-code={r.returncode}\n")
                  f.write(f"pi-out-file={state_file('last-pi.out')}\n")
              if r.returncode != 0:
                  sys.exit(1)
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("pi-run (LLM stages)", _tb.format_exc(), e)
              raise
      - name: Assemble the PR body (template fallback — only when pi produced none; stage 15 completes it)
        run: |
          if [ -s "$RUNNER_TEMP/cw/pr-body.md" ]; then
            echo "PR body generated by pi from the requirements, the plan and the review — keeping it"
            exit 0
          fi
          echo "pi produced no body — assembling the template fallback"
          python3 - "$RUNNER_TEMP/cw/pr-body.md" <<'EOF'
          import glob, os, subprocess, sys
          out = sys.argv[1]
          cw = os.path.join(os.environ["RUNNER_TEMP"], "cw")
          repo = os.environ.get("GITHUB_WORKSPACE", ".")

          def trigger_state(name):
              # the trigger's state files are the authoritative channel: this
              # runner build's job-env relay has been observed dropping the
              # CW_* trigger values (a body once opened for 'issue: # —'); the
              # env is the fallback for healthy runners, not the source
              try:
                  v = open(os.path.join(cw, "state", "trigger",
                                        name + ".txt")).read().strip()
              except OSError:
                  v = ""
              return v or os.environ.get("CW_" + name.upper().replace("-", "_"), "")

          issue = trigger_state("issue-number") or "?"
          title = trigger_state("issue-title")
          target = os.environ.get("CW_TARGET", "main")

          # the body describes the issue the run implements — not the
          # configuration the run used (that lives in the workflow log, which
          # the resolved-config file itself marks 'never committed')
          lines = ["# %s" % (title or "AI work for issue #%s" % issue),
                   "",
                   "Opened by the Code Weaver factory — branch "
                   "`ai/code-weaver/%s` → target `%s`. This pull request is "
                   "the run's status report — stage 15 completes it." % (issue, target),
                   "",
                   "## The issue this run implements",
                   "- **Issue:** #%s%s" % (issue, (" — " + title) if title else ""),
                   "- **Target branch:** `%s`" % target,
                   ""]

          # the plan — what the run set out to build, task by task — embedded
          # so the body stands on its own (the plan file is the issue's plan,
          # in the repo)
          plan = os.path.join(repo, os.environ.get("PLAN_DIR", "plans"),
                              issue + ".md")
          if os.path.isfile(plan):
              lines += ["## The plan for this issue", "```markdown"]
              lines += open(plan, encoding="utf-8",
                            errors="replace").read().splitlines()
              lines += ["```", ""]

          # the requirement scenarios the run changed — parsed from the
          # diff's ADDED scenario lines (the delta's shape), not from all
          # the scenarios of a merely touched file
          req_rel = os.environ.get("REQUIREMENTS_DIR", "requirements")
          base = trigger_state("base-sha")
          changed = None
          if base and os.path.isdir(os.path.join(repo, ".git")):
              r = subprocess.run(
                  ["git", "diff", "--name-only", base, "--", req_rel],
                  cwd=repo, capture_output=True, text=True)
              if r.returncode == 0:
                  changed = [l for l in r.stdout.splitlines()
                             if l.endswith(".feature")
                             and os.path.isfile(os.path.join(repo, l))]
          listed = []
          any_diff = False
          if changed is not None:
              for rel in sorted(changed):
                  r = subprocess.run(
                      ["git", "diff", base, "--", rel],
                      cwd=repo, capture_output=True, text=True)
                  if r.returncode != 0 or not r.stdout.strip():
                      continue
                  any_diff = True
                  for ln in r.stdout.splitlines():
                      if ln.startswith("+") and not ln.startswith("+++"):
                          s = ln[1:].strip()
                          for kw in ("Scenario Outline: ", "Scenario: "):
                              if s.startswith(kw):
                                  listed.append("- %s — %s" %
                                                (s[len(kw):].strip(),
                                                 os.path.basename(rel)))
                                  break
              if listed:
                  lines += (["## The requirement scenarios this run changed"]
                             + listed + [""])
              elif any_diff:
                  lines += ["## The requirement scenarios this run changed",
                            "- no scenario title was added — the run's delta "
                            "to the oracle is recorded in the run's artifacts "
                            "(the workflow log)",
                            ""]
              else:
                  lines += ["## The requirement scenarios this run changed",
                            "- the run changed no requirement scenario "
                            "(a vacuous delta)",
                            ""]
          else:
              lines += ["## The requirement scenarios this run changed",
                        "- (the run's delta is recorded in the run's artifacts "
                        "— the workflow log)",
                        ""]

          stages = []
          for f in sorted(glob.glob(os.path.join(cw, "**", "stage-summary.txt"),
                                    recursive=True)):
              stages += [l.strip() for l in open(f) if l.strip()]
          lines.append("## Stage outcomes so far")
          lines += ["- " + l for l in dict.fromkeys(stages)] or ["- (none captured yet)"]
          lines += ["",
                    "_Stage 15 (final status) completes this description with the run's "
                    "outcome, its usage totals and cost — and closes the issue on a "
                    "successful run._"]
          open(out, "w").write("\n".join(lines) + "\n")
          EOF
        env:
          # the state files are the source; the env is the fallback (this
          # runner build's job-env relay has been observed dropping these
          # values — the step reads the trigger's state files first)
          CW_ISSUE: ${{ env.CW_ISSUE_NUMBER }}
          CW_TITLE: ${{ env.CW_ISSUE_TITLE }}
          CW_TARGET: ${{ inputs.target-branch }}
          REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
          PLAN_DIR: ${{ inputs.plan-dir }}
      - id: open-pr
        env:
          CW_BODY_FILE: ${{ runner.temp }}/cw/pr-body.md
        name: Stage 12 — push & open the PR
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - id: open
        env:
          CW_BODY_FILE: ${{ runner.temp }}/cw/pr-body.md
        name: Push the AI branch and open (or update) the PR
        if: ${{ env.CW_STARTED == 'true' }}
        shell: /usr/bin/env python3 {0}  # bare "python3" is not a runner-accepted shell form
        working-directory: ${{ github.workspace }}
        run: |
          try:
              import os, sys, json
              action_dir = os.path.join(os.environ.get("RUNNER_TEMP", ""), "cw", "stash", ".github", "actions", "pr-open")
              scripts = os.path.join(os.path.dirname(os.path.dirname(action_dir)), "scripts")
              if os.path.isdir(scripts):
                  sys.path.insert(0, scripts)
              try:
                  import common
              except ImportError:
                  common = None

              # a crashed stage must leave a persistent diagnosis (the job log dies
              # with the run; a ghost run's logs are unreachable from the API) —
              # the full traceback goes to the runner's diag dir + one line to the
              # stage-fail-reason state file the summary/upload steps carry on
              def _cw_persist(stage, dump, value):
                  # one writer for both paths (the explicit try/except wrap and the
                  # excepthook) — the job-visible ::error:: line, the stage-fail-reason
                  # state file (carried on by the summary/upload steps), and the
                  # runner's durable diag log (the job log dies with the run)
                  if globals().get("_cw_persisted"):
                      return
                  globals()["_cw_persisted"] = True
                  try:
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                          f.write(f"stage {stage} FAILED — {value}\n")
                      with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                          f.write(f"=== stage {stage} FAILED ===\n{dump}\n")
                      print(f"::error::stage {stage} failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
                  except Exception:
                      print(f"::error::stage {stage} failed — {value}")

              def _cw_on_uncaught(t, v, tb):
                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("12 pr-open", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              head, base = _cw_in("head"), _cw_in("base")
              title, body_file, issue = (_cw_in("title"),
                                         _cw_in("body-file"),
                                         _cw_in("issue-number"))
              repo = os.environ["GITHUB_WORKSPACE"]
              token = os.environ.get("GH_TOKEN", "")

              if common:
                  common.push_branch(head)
              else:
                  # minimal push without the shared script (degenerate checkout) —
                  # token rides in the push URL only; the origin remote is untouched
                  import subprocess
                  subprocess.run(
                      ["git", "push", "--force",
                       f"https://x-access-token:{token}@github.com/{os.environ['GITHUB_REPOSITORY']}",
                       head],
                      cwd=repo, check=True,
                      env={k: v for k, v in os.environ.items() if k != "GH_TOKEN"})

              def gh(*a):
                  import subprocess
                  return subprocess.run(["gh", *a], cwd=repo, capture_output=True,
                                        text=True, env={**os.environ, "GH_TOKEN": token})

              # a PR from this head already exists? update it, don't duplicate
              view = gh("pr", "view", head, "--json", "number,url")
              if view.returncode == 0 and view.stdout.strip():
                  pr = json.loads(view.stdout)
                  gh("pr", "edit", str(pr["number"]), "--body-file", body_file)
                  number, url = str(pr["number"]), pr["url"]
              else:
                  cr = gh("pr", "create", "--base", base, "--head", head,
                          "--title", title, "--body-file", body_file)
                  if cr.returncode != 0:
                      print(f"::error::pr create failed: {cr.stderr.strip()[:300]}")
                      sys.exit(1)
                  view = gh("pr", "view", head, "--json", "number,url")
                  pr = json.loads(view.stdout)
                  number, url = str(pr["number"]), pr["url"]

              if common:
                  common.log(f"stage 12: PR #{number} open — {url} (ai-branch {head} → {base})")
              gh("issue", "comment", issue,
                 "--body", f"🏭 **code-weaver** — pull request open: {url}\n\n"
                           f"Base: `{base}` — head: `{head}`. The PR body carries the "
                           f"final status report (stage 15 completes it). Merging is a human decision.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"pr-number={number}\npr-url={url}\n")
              # state files — the gates & report jobs read the PR identity from
              # the artifact (the job-outputs relay is not their value channel)
              st = os.path.join(os.environ.get("RUNNER_TEMP", ""),
                                "cw", "state", "pr")
              os.makedirs(st, exist_ok=True)
              open(os.path.join(st, "pr-number.txt"), "w").write(str(number))
              open(os.path.join(st, "pr-url.txt"), "w").write(url)
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("12 pr-open", _tb.format_exc(), e)
              raise
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-pr
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
    outputs:
      pr-number: ${{ steps.open.outputs.pr-number }}
      pr-url: ${{ steps.open.outputs.pr-url }}

  # ── stages 13+14 ───────────────────────────────────────────────────────
  gates:
    name: "13-14 PR gates (all green; fix loop bounded; never merges)"
    needs: [pr, baseline]
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      LLM_MODEL: ${{ inputs.llm-model }}
      REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
      PLAN_DIR: ${{ inputs.plan-dir }}
      DOC_DIR: ${{ inputs.doc-dir }}
      MAX_LOOPS: ${{ inputs.max-loops }}
      # ISSUE_NUMBER / AI_BRANCH / CW_PR_NUMBER arrive via GITHUB_ENV from
      # the stage artifacts (Read trigger / Read PR state steps)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The runner has checked out THIS repo at the called ref into the
        # workspace (that is how it obtained this workflow file); the stage
        # checkouts below replace it with the TARGET repo, which holds no copy
        # of the factory's runtime tree. So the tree the inlined stage steps
        # execute (the .github scripts, the stage scripts, the pi prompt
        # templates) is copied to $RUNNER_TEMP first — RUNNER_TEMP survives
        # every later checkout, and the repo-relative layout is preserved, so
        # the scripts' __file__-relative imports keep resolving. Same-repo and
        # cross-repo runs take this one identical path: no GITHUB_ACTION_PATH
        # guessing, no action boundary, no own-action refs.
        run: |
          [ -d .github ] || { echo "::error::no .github at the workspace root — the called-repo checkout the runner should have made is missing; the factory runtime tree cannot be stashed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cw/stash"
          cp -r .github "$RUNNER_TEMP/cw/stash/"
          if [ -d pi-prompts ]; then cp -r pi-prompts "$RUNNER_TEMP/cw/stash/"; fi
          echo "stashed the factory runtime tree to $RUNNER_TEMP/cw/stash (.github: $(find "$RUNNER_TEMP/cw/stash/.github" -type f | wc -l) files)"
      # Value source — the trigger's resolved config rides the ARTIFACT:
      # the job-outputs relay has been observed dropping a value for one
      # downstream job while the next job received it (issue-number present
      # in baseline, missing in extract). The artifact is the oracle's
      # stage-results channel; GITHUB_ENV then feeds the rest of the job.
      - name: Stage state — trigger
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-pr
          path: ${{ runner.temp }}/cw
      - name: Read PR state
        run: |
          T="$RUNNER_TEMP/cw/state/pr"
          [ -f "$T/pr-number.txt" ] || { echo "no PR state (the pr stage did not complete)"; exit 0; }
          echo "CW_PR_NUMBER=$(cat "$T/pr-number.txt")" >> "$GITHUB_ENV"
          [ -f "$T/pr-url.txt" ] && echo "CW_PR_URL=$(cat "$T/pr-url.txt")" >> "$GITHUB_ENV"
          echo "pr state: #$(cat "$T/pr-number.txt") $(cat "$T/pr-url.txt" 2>/dev/null)"
      - id: head
        name: Resolve the PR's head sha
        run: |
          # Self-contained on purpose: on this runner build the GITHUB_ENV
          # write from the previous step (Read PR state) has been observed
          # NOT to reach the next step's env — an empty CW_PR_NUMBER here
          # means `pulls//head.sha` → 404 → step failure (deterministic in
          # the re-run of run 40081410050's gates job). The state file is
          # the authoritative relay (the job-outputs binding has the same
          # ghost family); the env stays as fallback for healthy runners.
          PR=$(cat "$RUNNER_TEMP/cw/state/pr/pr-number.txt" 2>/dev/null) || true
          [ -n "$PR" ] || PR="${CW_PR_NUMBER}"
          # The sha comes from the FULL PR object via jq: the field-suffix
          # form of the endpoint (`pulls/<n>/head.sha`) 404s on this API
          # surface — and its 404 body echoed into GITHUB_OUTPUT is an
          # invalid file command, so the step died before the gate loop ever
          # started (run 40219192721's gates job: 4 s from start to death,
          # against a perfectly healthy PR #48 whose full object carried
          # head.sha all along).
          HEAD_SHA=$(gh api repos/$GITHUB_REPOSITORY/pulls/"$PR" --jq .head.sha 2>/dev/null) || true
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::could not resolve the head sha of PR #${PR} — the gates have nothing to poll; check the PR and the token's access to the repo"
            exit 1
          fi
          echo "head-sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - name: Stage 13-14 — wait for every PR-triggered workflow; fix reds
        env:
          CW_HEAD_SHA: ${{ steps.head.outputs.head-sha }}
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - name: Gate loop — all PR-triggered workflows green (bounded; never merges)
        env:
          CW_HEAD_SHA: ${{ steps.head.outputs.head-sha }}
        if: ${{ env.CW_STARTED == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        # The stage script runs from the stash — the runtime tree this
        # job's first step copied from the called repo at the called ref,
        # before the stage's checkout replaced the workspace with the target.
        run: |-
          S="$RUNNER_TEMP/cw/stash/.github/actions/gates-stage/stage.py"
          [ -f "$S" ] || { echo "::error::stashed stage script $S is missing — the stash step did not run before this step"; exit 1; }
          python3 "$S"
      - name: Push the AI branch (post-fix state)
        if: ${{ success() || failure() }}
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${AI_BRANCH}" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-gates
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore

  # ── stage 15 ───────────────────────────────────────────────────────────
  report:
    name: "15 final status report (the PR is the report)"
    needs: [trigger, setup-pi, baseline, extract, plan, implement, review, pr, gates]
    # runs on success AND failure (a run that died early is reported too), but
    # stays silent when the trigger decided no factory run should start
    if: ${{ always() && needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DOC_DIR: ${{ inputs.doc-dir }}
      # (no ternary in this job's env — a `?` in a reusable workflow's
      # expressions makes the file invalid; the parenthesized &&/|| chain with
      # string literals expresses the same if-else; job-level env stays to
      # factory inputs + the job-result relay — trigger/PR values arrive via
      # GITHUB_ENV from the stage artifacts, which is why the state steps sit
      # where they do)
      CW_RUN_RESULT: "${{ ((contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure') || 'success' }}"
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The runner has checked out THIS repo at the called ref into the
        # workspace (that is how it obtained this workflow file); the stage
        # checkouts below replace it with the TARGET repo, which holds no copy
        # of the factory's runtime tree. So the tree the inlined stage steps
        # execute (the .github scripts, the stage scripts, the pi prompt
        # templates) is copied to $RUNNER_TEMP first — RUNNER_TEMP survives
        # every later checkout, and the repo-relative layout is preserved, so
        # the scripts' __file__-relative imports keep resolving. Same-repo and
        # cross-repo runs take this one identical path: no GITHUB_ACTION_PATH
        # guessing, no action boundary, no own-action refs.
        run: |
          [ -d .github ] || { echo "::error::no .github at the workspace root — the called-repo checkout the runner should have made is missing; the factory runtime tree cannot be stashed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cw/stash"
          cp -r .github "$RUNNER_TEMP/cw/stash/"
          if [ -d pi-prompts ]; then cp -r pi-prompts "$RUNNER_TEMP/cw/stash/"; fi
          echo "stashed the factory runtime tree to $RUNNER_TEMP/cw/stash (.github: $(find "$RUNNER_TEMP/cw/stash/.github" -type f | wc -l) files)"
      # Value source — the trigger's resolved config rides the ARTIFACT:
      # the job-outputs relay has been observed dropping a value for one
      # downstream job while the next job received it (issue-number present
      # in baseline, missing in extract). The artifact is the oracle's
      # stage-results channel; GITHUB_ENV then feeds the rest of the job.
      - name: Stage state — trigger
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref || steps.state.outputs.base-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-setup
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-extract
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-plan
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-implement
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-review
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-gates
          path: ${{ runner.temp }}/cw

      - name: Read PR state
        run: |
          T="$RUNNER_TEMP/cw/state/pr"
          [ -f "$T/pr-number.txt" ] || { echo "no PR state (the pr stage did not complete)"; exit 0; }
          echo "CW_PR_NUMBER=$(cat "$T/pr-number.txt")" >> "$GITHUB_ENV"
          [ -f "$T/pr-url.txt" ] && echo "CW_PR_URL=$(cat "$T/pr-url.txt")" >> "$GITHUB_ENV"
