                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("pi-run (LLM stages)", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              from common import pi_invoke, state_file
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              def _cw_in_opt(name):
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  return None

              prompts = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(action_dir))), "pi-prompts")
              template = _cw_in("template")
              sp = os.path.join(prompts, template + ".md")
              if not os.path.exists(sp):
                  print(f"::error::unknown pi prompt template '{template}' (have: "
                        f"{sorted(os.path.basename(p) for p in os.listdir(prompts)) if os.path.isdir(prompts) else 'none'})")
                  sys.exit(1)
              r = pi_invoke(
                  model=_cw_in("model"),
                  system_prompt_file=sp,
                  prompt_file=_cw_in_opt("prompt-file"),
                  context=(_cw_in_opt("context") or "").split(),
                  timeout=int(_cw_in_opt("timeout") or 1800),
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"pi-exit-code={r.returncode}\n")
                  f.write(f"pi-out-file={state_file('last-pi.out')}\n")
              if r.returncode != 0:
                  sys.exit(1)
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("pi-run (LLM stages)", _tb.format_exc(), e)
              raise
      - name: Assemble the PR body (template fallback — only when pi produced none; stage 15 completes it)
        run: |
          if [ -s "$RUNNER_TEMP/cw/pr-body.md" ]; then
            echo "PR body generated by pi from the requirements, the plan and the review — keeping it"
            exit 0
          fi
          echo "pi produced no body — assembling the template fallback"
          python3 - "$RUNNER_TEMP/cw/pr-body.md" <<'EOF'
          import glob, os, subprocess, sys
          out = sys.argv[1]
          cw = os.path.join(os.environ["RUNNER_TEMP"], "cw")
          repo = os.environ.get("GITHUB_WORKSPACE", ".")

          # The factory's single git entry point (one function every git
          # call routes through — the test suite mocks that one function,
          # so no test spawns the real git binary). This step runs in a
          # fresh interpreter with no common module, so it carries its own
          # copy; a test-injected entry point in this script's globals is
          # honoured over it.
          if "git_exec" not in globals():
              def git_exec(argv, **kw):
                  return subprocess.run(["git"] + list(argv), **kw)

          def trigger_state(name):
              # the trigger's state files are the authoritative channel: this
              # runner build's job-env relay has been observed dropping the
              # CW_* trigger values (a body once opened for 'issue: # —'); the
              # env is the fallback for healthy runners, not the source
              try:
                  v = open(os.path.join(cw, "state", "trigger",
                                        name + ".txt")).read().strip()
              except OSError:
                  v = ""
              return v or os.environ.get("CW_" + name.upper().replace("-", "_"), "")

          issue = trigger_state("issue-number") or "?"
          title = trigger_state("issue-title")
          target = os.environ.get("CW_TARGET", "main")

          # the body describes the issue the run implements — not the
          # configuration the run used (that lives in the workflow log, which
          # the resolved-config file itself marks 'never committed')
          lines = ["# %s" % (title or "AI work for issue #%s" % issue),
                   "",
                   "Opened by the Code Weaver factory — branch "
                   "`ai/code-weaver/%s` → target `%s`. This pull request is "
                   "the run's status report — stage 15 completes it." % (issue, target),
                   "",
                   "## The issue this run implements",
                   "- **Issue:** #%s%s" % (issue, (" — " + title) if title else ""),
                   "- **Target branch:** `%s`" % target,
                   ""]

          # the plan — what the run set out to build, task by task — embedded
          # so the body stands on its own (the plan file is the issue's plan,
          # in the repo)
          plan = os.path.join(repo, os.environ.get("PLAN_DIR", "plans"),
                              issue + ".md")
          if os.path.isfile(plan):
              lines += ["## The plan for this issue", "```markdown"]
              lines += open(plan, encoding="utf-8",
                            errors="replace").read().splitlines()
              lines += ["```", ""]

          # the requirement scenarios the run changed — parsed from the
          # diff's ADDED scenario lines (the delta's shape), not from all
          # the scenarios of a merely touched file
          req_rel = os.environ.get("REQUIREMENTS_DIR", "requirements")
          base = trigger_state("base-sha")
          changed = None
          if base and os.path.isdir(os.path.join(repo, ".git")):
              r = git_exec(["diff", "--name-only", base, "--", req_rel],
                           cwd=repo, capture_output=True, text=True)
              if r.returncode == 0:
                  changed = [l for l in r.stdout.splitlines()
                             if l.endswith(".feature")
                             and os.path.isfile(os.path.join(repo, l))]
          listed = []
          any_diff = False
          if changed is not None:
              for rel in sorted(changed):
                  r = git_exec(["diff", base, "--", rel],
                               cwd=repo, capture_output=True, text=True)
                  if r.returncode != 0 or not r.stdout.strip():
                      continue
                  any_diff = True
                  for ln in r.stdout.splitlines():
                      if ln.startswith("+") and not ln.startswith("+++"):
                          s = ln[1:].strip()
                          for kw in ("Scenario Outline: ", "Scenario: "):
                              if s.startswith(kw):
                                  listed.append("- %s — %s" %
                                                (s[len(kw):].strip(),
                                                 os.path.basename(rel)))
                                  break
              if listed:
                  lines += (["## The requirement scenarios this run changed"]
                             + listed + [""])
              elif any_diff:
                  lines += ["## The requirement scenarios this run changed",
                            "- no scenario title was added — the run's delta "
                            "to the oracle is recorded in the run's artifacts "
                            "(the workflow log)",
                            ""]
              else:
                  lines += ["## The requirement scenarios this run changed",
                            "- the run changed no requirement scenario "
                            "(a vacuous delta)",
                            ""]
          else:
              lines += ["## The requirement scenarios this run changed",
                        "- (the run's delta is recorded in the run's artifacts "
                        "— the workflow log)",
                        ""]

          stages = []
          for f in sorted(glob.glob(os.path.join(cw, "**", "stage-summary.txt"),
                                    recursive=True)):
              stages += [l.strip() for l in open(f) if l.strip()]
          lines.append("## Stage outcomes so far")
          lines += ["- " + l for l in dict.fromkeys(stages)] or ["- (none captured yet)"]
          lines += ["",
                    "_Stage 15 (final status) completes this description with the run's "
                    "outcome, its usage totals and cost — and closes the issue on a "
                    "successful run._"]
          open(out, "w").write("\n".join(lines) + "\n")
          EOF
        env:
          # the state files are the source; the env is the fallback (this
          # runner build's job-env relay has been observed dropping these
          # values — the step reads the trigger's state files first)
          CW_ISSUE: ${{ env.CW_ISSUE_NUMBER }}
          CW_TITLE: ${{ env.CW_ISSUE_TITLE }}
          CW_TARGET: ${{ inputs.target-branch }}
          REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
          PLAN_DIR: ${{ inputs.plan-dir }}
      - id: open-pr
        env:
          CW_BODY_FILE: ${{ runner.temp }}/cw/pr-body.md
        name: Stage 12 — push & open the PR
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
