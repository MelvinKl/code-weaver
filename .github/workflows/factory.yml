# Code Weaver — the factory (reusable workflow, consumed BY REF)
#
# A target repo invokes this file with `uses: <owner>/code-weaver/
# .github/workflows/factory.yml@<version tag>` from its own short
# workflow. ONE ref is the only version selection a run makes — the
# consumer pins the version exactly once, on its uses: line:
#
# - the workflow is SELF-CONTAINED in its logic: every stage's steps
#   live in this file (15 logical stages over 10 jobs — the trigger
#   plus 9 stage jobs; read the `name:` of each stage step). There are
#   no composite actions to reference: an own-action `uses:` would have
#   to be a fully qualified owner/repo/path ref pinned to a ref that
#   only a release-time rewrite of this file could make consistent (a
#   workflow-file update the publishing principal is refused), and a
#   relative path would resolve against the CALLING repo's checkout —
#   where a target holds no copy of the factory's scripts. The stage
#   steps below are the former action definitions, inlined at their
#   former splice sites.
# - the workflow carries NO BINARY content: the tree its stage steps
#   execute (the .github scripts, the stage scripts, the pi prompt
#   templates) is not embedded in this file — the base64-tarball embed
#   is retired (a binary payload in a file that must be plain text, and
#   the bloat that took the published file past its max allowed size).
#   The called ref selects a published version — a tag pointing at a
#   commit of this repo whose tree carries both this file and that
#   runtime tree — and the first job's fetch brings that version's tree
#   to the run: one ref selects the workflow file and its runtime tree
#   as one version; there is no second ref to pin, relay, clone or
#   bump.
#
# GitHub fetches only the called workflow's file — it never checks the
# factory repo into the target's workspace, and the called ref is not
# visible to the jobs (that invisibility is what the recovery answers):
# the trigger job reads the consumer workflow as committed at the run's
# base ref over the GitHub API (no checkout has happened yet, so
# nothing has replaced the workspace — the token reads the target repo,
# which the documented contract already requires) and recovers the ref
# the consumer's uses: line declared: a declared version tag resolves to
# the factory repo fetched at that tag, and the relative uses: form
# (the file read from the triggering commit — the legacy dogfood shape)
# resolves to the triggering repo itself at the run's base ref. The
# trigger job then fetches that version's curated runtime tree into
# $RUNNER_TEMP/cw/stash before the first checkout replaces the
# workspace — the fetch is a public-repo fetch that does not ride the
# target-scoped GH_TOKEN (such a token cannot read the factory repo),
# and RUNNER_TEMP survives every later checkout, so the tree's
# repo-relative layout keeps the scripts' __file__-relative imports
# resolving — and rides it on the cw-trigger artifact (that upload
# runs always() and opts into hidden files — the tree sits under the
# hidden .github/ directory, which upload-artifact drops by default —
# as does every upload in the chain, so no hop loses it); every later
# stage job's first step downloads that artifact back before its
# checkout replaces the workspace. The version a run executes is
# selected by the called ref alone: the file GitHub fetched at that ref
# and the tree the trigger job fetched at that same ref are the two
# halves of the version the tag's commit carries — on any runner,
# independently of what any earlier run left in the workspace.
#
# The `factory-ref` input is a legacy no-op, kept declared so a with:
# block written for an older version of this file stays schema-valid:
# no stage reads it anymore.
#
# The stage code resolves each value as `INPUT_*`, then a `CW_*`
# job/step env, then the stage's state file — the step env entries
# the inlined steps declare relay the values exactly as the former
# composite-action boundary did, so the resolution chain is
# unchanged.
#
# The steps use `${{ runner.temp }}`, not `env.RUNNER_TEMP` (this
# runner build does not materialise `env.*` inside step `run:`
# bodies — the state dir would land under the literal string
# `env.RUNNER_TEMP`), and `gh` must run in the job's own env: a
# nested shell with only `GH_TOKEN` set inherits dangling
# `GIT_CONFIG_KEY_i` entries and dies with
# `unknown value GIT_CONFIG_COUNT`.
name: Code Weaver factory

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue to process (empty = the triggering issue)
        type: string
        required: false
        default: ""
      ai-requirements-label:
        description: Label whose presence on an issue starts the factory
        type: string
        default: ai-requirements
      target-branch:
        description: Base branch the PR is opened against
        type: string
        default: main
      requirements-dir:
        description: Directory the factory writes Gherkin requirements to
        type: string
        default: requirements
      plan-dir:
        description: Directory the factory writes plans to
        type: string
        default: plans
      doc-dir:
        description: Directory of the project's arc42 markdown files
        type: string
        default: docs
      llm-model:
        description: Which configured model pi uses (the backend is the one in the run's provided model configuration — a GitHub secret or the repo file .pi/agent/models.json)
        type: string
        default: Ornith-1.5-35B-A3B
      max-loops:
        description: Fix/guard loop cap per stage — 0 means no cap
        type: string
        default: "5"
      pi-timeout:
        description: The per-call time cap in seconds every pi invocation in the pipeline runs under — the stages' generation calls, the guard's repair call, the PR-body call; the default 21600 is the current 360-minute cap, which a consumer that leaves the input undeclared keeps
        type: string
        required: false
        default: "21600"
      job-timeout:
        description: The job-level timeout-minutes the five stage jobs that make pi calls (extract, plan, implement, review, pr) run under — the target's value where the target sets the input, its "480" default where a consumer leaves the input undeclared (such a run keeps the 480-minute backstop, unchanged); the trigger and the setup-pi jobs are unaffected by the input
        type: string
        required: false
        default: "480"
      runner:
        description: Runner label the stage jobs run on (pi is installed & configured for the run by stage 2 — not a pre-requisite of the environment)
        type: string
        default: ubuntu-latest
      workflow-name:
        description: The target's workflow file name (without .yml) — used for the idempotency query
        type: string
        default: code-weaver
      dependency-install:
        description: The command the run's pipeline runs to install the target project's dependencies — executed in the jobs whose stages consume them (implement, test-and-review) after each job's checkout and before its stage; empty = no such step, the run is unchanged
        type: string
        required: false
        default: ""
      dependency-upgrade:
        description: Whether the run's pipeline runs the dependency-upgrade stage — the stage upgrades the target project's dependencies to newer versions, before the implementation stage; "off" = the pipeline runs without the stage (the run's stages, pull request and final status report are unchanged)
        type: string
        required: false
        default: "on"
      factory-ref:
        # legacy no-op, kept declared: a with: block written for an
        # older version of this file passes this input, and the run must
        # not die on a key the new file no longer reads. No stage reads it
        # anymore — the called version's runtime tree is fetched at the
        # called ref (recovered from the consumer workflow, never
        # relayed), so the consumer's uses: ref is the only pin.
        description: "(legacy) the ref the consumer's uses: line names; no stage reads it — the called version's runtime tree is fetched at the called ref, so the uses: ref is the only pin a run makes"
        type: string
        required: false
        default: ""
    secrets:
      GH_TOKEN:
        description: Token with contents:write + issues:write + pull-requests:write on the target repo
        required: true
      # The run's pi harness providers — all optional: an unset or empty
      # secret arrives empty and the setup stage treats it as an absent
      # provider (the repo files .pi/agent/models.json, .pi/settings.json
      # and .pi/mcp.json are the fallbacks the stage resolves from). A
      # provider value never appears in a with: input or a committed file.
      PI_MODELS:
        description: The run's model configuration — the content of .pi/agent/models.json; the backend in it is the run's LLM backend
        required: false
      PI_SETTINGS:
        description: The run's additional-packages settings — the content of .pi/settings.json; empty or absent leaves pi without additional packages
        required: false
      PI_MCP:
        description: The run's MCP configuration — the content of .pi/mcp.json; absent means the run's pi runs without MCP servers
        required: false
      PI_EXTENSION_ENV:
        description: The pi extension's environment variables in .env style (such as the ones .pi/extensions/pi-jev-config.ts carries)
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ── stage 1 ────────────────────────────────────────────────────────────
  trigger:
    name: "1 trigger"
    runs-on: ${{ inputs.runner }}
    outputs:
      started: ${{ steps.resolve.outputs.started }}
      issue-number: ${{ steps.resolve.outputs.issue-number }}
      issue-title: ${{ steps.resolve.outputs.issue-title }}
      base-ref: ${{ steps.resolve.outputs.base-ref }}
      base-sha: ${{ steps.resolve.outputs.base-sha }}
    steps:
      - id: preflight
        name: Preflight — verify the GH_TOKEN secret can serve this repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Every stage authenticates with GH_TOKEN. A misconfigured secret used
          # to surface as an opaque checkout failure (403, empty logs) — so fail
          # here, first, and name the exact cause:
          #   empty  → the secret was never set (or the caller did not pass it)
          #   401    → the token is invalid, expired or was revoked
          #   403    → the token authenticates but has no access to this repo
          #            (its user/app is not a member of the owning org, or a
          #            fine-grained PAT is scoped to a different repository)
          #   other  → the runner has no egress to api.github.com
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN secret is empty — set a repo/org secret GH_TOKEN that can read this repo, and pass it from the caller's workflow"
            exit 1
          fi
          # Every factory stage shells out to these; a missing one would die
          # mid-stage with an unhelpful exit 127 ("command not found")
          for TOOL in git jq gh python3; do
            command -v "$TOOL" >/dev/null 2>&1 || {
              echo "::error::required tool '$TOOL' is not installed on this runner — install it in the runner environment (pi is installed & configured separately in stage 2)"
              exit 1
            }
          done
          echo "runner tools verified: git, jq, gh, python3"
          HTTP=$(curl -s -o /tmp/cw-preflight.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY") || {
            echo "::error::GitHub API unreachable from this runner — check the runner's internet egress"
            exit 1
          }
          case "$HTTP" in
            200) echo "GH_TOKEN verified: authenticates and can read $GITHUB_REPOSITORY" ;;
            401) echo "::error::GH_TOKEN was rejected by GitHub (401) — the token is invalid, expired or was revoked"; exit 1 ;;
            403) if grep -q 'Bad credentials' /tmp/cw-preflight.json 2>/dev/null; then
                    echo "::error::GH_TOKEN was rejected by GitHub (403, bad credentials) — the token is invalid, expired or was revoked"
                  else
                    echo "::error::GH_TOKEN authenticates but has NO access to $GITHUB_REPOSITORY (403) — its user/app is not a member of the owning org, or a fine-grained PAT is scoped to a different repository"
                  fi
                  exit 1 ;;
            *) echo "::error::GitHub API answered HTTP $HTTP (expected 200) — check the runner's internet egress"; cat /tmp/cw-preflight.json; exit 1 ;;
          esac
      - id: called-version
        name: Resolve the called version (from the consumer workflow at the run's base ref)
        # The called ref is not visible to the run's jobs — GitHub
        # fetched this file from the factory repo at the ref the
        # consumer's uses: line declared, without telling the jobs which
        # ref that was. This step recovers it: the consumer workflow as
        # committed at the run's base ref, read over the GitHub API — no
        # checkout has happened yet, so nothing has replaced the
        # workspace. The recovery rides GH_TOKEN reading the target repo
        # (the documented token contract requires exactly that; the
        # up-front token verification is the preflight step above), and
        # it parses the consumer's uses: line for the two shapes a
        # consumer writes it in:
        #   owner-qualified — an external target's
        #   `uses: MelvinKl/code-weaver/.github/workflows/factory.yml@<version
        #   tag>`: a declared version tag selects a published version —
        #   the fetch is the factory repo at that tag;
        #   relative — the legacy dogfood shape (the runner reads the
        #   file from the triggering commit): the fetch is the
        #   triggering repo itself at the run's base ref.
        # One ref, one version: the file that runs and the tree its
        # steps execute are the two halves of the tag's commit — no
        # second ref enters the run, and the consumer's workflow gains
        # no line (the uses: line is the only pin; the (legacy)
        # factory-ref input stays declared and is read by no stage).
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -uo pipefail
          # make room for the fetch: the step below checks the called
          # version's tree out into the stash, over any tree an earlier
          # step left there
          rm -rf "$RUNNER_TEMP/cw/stash"
          CONSUMER_JSON=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/${{ inputs.workflow-name }}.yml?ref=${GITHUB_REF}") || {
            echo "::error::could not read the consumer workflow .github/workflows/${{ inputs.workflow-name }}.yml at ${GITHUB_REF} over the GitHub API — the called ref is recovered from that file, so the recovery needs it readable (a token that cannot read the target repo fails the preflight step, before this one)"
            exit 1
          }
          CONSUMER=$(jq -r '.content // ""' <<<"$CONSUMER_JSON" | base64 -d)
          USES=$(grep -E '^[[:space:]]*uses:' <<<"$CONSUMER" \
            | grep -F '.github/workflows/' | grep -F 'factory.yml' \
            | head -n 1 | sed -E 's/^[[:space:]]*uses:[[:space:]]*//')
          if [ -z "$USES" ]; then
            echo "::error::the consumer workflow at ${GITHUB_REF} has no uses: line invoking the factory's workflow file — the called ref is recovered from that line, and the recovery found none (the consumer invokes the factory by owner, repo, path and ref — or by a relative path, the legacy dogfood shape)"
            exit 1
          fi
          case "$USES" in
            *@*)
              # owner-qualified form — <owner>/<repo>/<workflow path>@<ref>:
              # a declared version tag selects a published version, and
              # the fetch is the factory repo at that tag
              CALLED_REF="${USES#*@}"
              CALLED_REPO=$(
                IFS='/' read -r OWNER REPO _PATH <<<"${USES%%@*}"
                echo "$OWNER/$REPO"
              )
              ;;
            *)
              # relative form — the legacy dogfood shape (the runner
              # reads the file from the triggering commit): the fetch is
              # the triggering repo itself at the run's base ref
              CALLED_REPO="$GITHUB_REPOSITORY"
              CALLED_REF="$GITHUB_REF"
              ;;
          esac
          echo "called-repo=$CALLED_REPO" >> "$GITHUB_OUTPUT"
          echo "called-ref=$CALLED_REF" >> "$GITHUB_OUTPUT"
          echo "called version resolved: $CALLED_REPO at $CALLED_REF — the ref's published version carries the file GitHub fetched and the runtime tree the next step fetches together (recovered from the consumer workflow at ${GITHUB_REF}; the consumer relays nothing)"
      - name: Stash the factory runtime tree (fetched at the called ref, before any checkout replaces the workspace)
        # The file stores no binary content — the runtime tree its stage
        # steps execute is not embedded in it. The tree reaches the run
        # the way the one-ref architecture already implies: the called
        # ref selects a published version, and the tag points at a commit
        # of the factory repo whose tree carries both the workflow file
        # and the runtime tree — so this step checks that version's
        # curated runtime tree (the .github/scripts, .github/actions and
        # pi-prompts prefixes) out into $RUNNER_TEMP/cw/stash,
        # preserving the repo-relative layout the stage scripts resolve
        # against, before the first checkout replaces the workspace.
        # The fetch does not ride the target-scoped GH_TOKEN (the
        # documented contract scopes that token to the target repo, and
        # it cannot read the factory repo): the factory repo is public,
        # and the empty token is the anonymous checkout the fetch is.
        # The trigger's upload-artifact (with its hidden-file opt-in)
        # then rides the stashed tree on the cw-trigger artifact to every
        # later stage job's first step.
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.called-version.outputs.called-repo }}
          ref: ${{ steps.called-version.outputs.called-ref }}
          path: ${{ runner.temp }}/cw/stash
          token: ""
          # the curated runtime tree — the prefixes the stage scripts
          # resolve against, repo-relative under the stash
          sparse-checkout: |
            /.github/scripts
            /.github/actions
            /pi-prompts
      - name: Verify the stashed runtime tree holds the canonical runtime files
        # The fetch materialised the called version's tree; the canonical
        # marker files the stage steps run from must be in it — a fetch
        # that came back short fails here, with the exact cause, before
        # the first checkout replaces the workspace.
        run: |
          set -e
          for f in \
            .github/scripts/common.py \
            .github/scripts/stages.py \
            .github/scripts/gherkin-validate.py \
            .github/scripts/release-number.py \
            .github/actions/setup-pi/stage.py \
            .github/actions/extract-stage/stage.py \
            .github/actions/plan-stage/stage.py \
            .github/actions/implement-stage/stage.py \
            .github/actions/review-stage/stage.py \
            .github/actions/gates-stage/stage.py \
            .github/actions/guard-check/guard-check.py \
            pi-prompts/requirements.md \
            pi-prompts/plan.md \
            pi-prompts/implement.md \
            pi-prompts/review.md \
            pi-prompts/pr-body.md
          do
            [ -f "$RUNNER_TEMP/cw/stash/$f" ] || {
              echo "::error::the fetched runtime tree is missing $f — the called version's tree does not carry the canonical runtime files its stage steps run from"
              exit 1
            }
          done
          echo "stashed the factory runtime tree to $RUNNER_TEMP/cw/stash (fetched at the called ref — the ref's version carries the file and the tree together: .github: $(find "$RUNNER_TEMP/cw/stash/.github" -type f | wc -l) files, pi-prompts: $(find "$RUNNER_TEMP/cw/stash/pi-prompts" -type f | wc -l) files)"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - id: resolve
        name: Resolve the issue & gate on the trigger label
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AI_REQUIREMENTS_LABEL: ${{ inputs.ai-requirements-label }}
        run: |
          set -uo pipefail
          echo "started=false" >> "$GITHUB_OUTPUT"
          ISSUE="${{ inputs.issue-number }}"
          [ -z "$ISSUE" ] && ISSUE="${{ github.event.issue.number || '' }}"
          if [ -z "$ISSUE" ]; then
            echo "no issue to process (no input, no issue event) — factory idle"
            mkdir -p "$RUNNER_TEMP/cw/state/trigger"
            echo "false" > "$RUNNER_TEMP/cw/state/trigger/started.txt"
            exit 0
          fi
          echo "issue-number=$ISSUE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "issues" ]; then
            LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" | jq -r '.labels[].name')
            if ! grep -qx -- "$AI_REQUIREMENTS_LABEL" <<<"$LABELS"; then
              echo "issue $ISSUE does not carry '$AI_REQUIREMENTS_LABEL' — factory idle"
              mkdir -p "$RUNNER_TEMP/cw/state/trigger"
              echo "false" > "$RUNNER_TEMP/cw/state/trigger/started.txt"
              exit 0
            fi
          fi
          # idempotency: a second run for the same issue while the first is in progress
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${{ inputs.workflow-name }}.yml/runs?status=in_progress&per_page=20" \
            | jq -r --arg n "$ISSUE" '[.workflow_runs[]? | select((.inputs?["issue-number"] // "") == $n) | .id] | join(" ")') || true
          if [ -n "$EXISTING" ]; then
            mkdir -p "$RUNNER_TEMP/cw/state/trigger"
            echo "false" > "$RUNNER_TEMP/cw/state/trigger/started.txt"
            gh issue comment "$ISSUE" --body "⏳ **code-weaver** — a factory run for issue #${ISSUE} is already in progress (run ${EXISTING}). This trigger exits without duplicating work."
            exit 0
          fi
          # validate the run's configuration before the trigger records or
          # accepts the run — a configuration that cannot serve the stages
          # fails here, at trigger time, with a precise error: this step's
          # started output stays false (the step's first line wrote it),
          # and every stage job gates on it, so a failed trigger skips
          # every stage — no stage runs after the trigger
          JOB_TIMEOUT="${{ inputs.job-timeout }}"
          if ! [[ "$JOB_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "::error::job-timeout '${JOB_TIMEOUT}' is not a number of minutes — a job-level timeout-minutes must be a number of minutes (the five stage jobs that make pi calls run under it); the run fails at trigger time and no stage runs after the trigger"
            exit 1
          fi
          JOB_TIMEOUT_SECONDS=$(( JOB_TIMEOUT * 60 ))
          # the headroom: the margin the stage's own non-call work
          # (checkout, guard, loop machinery, artifact sync, push)
          # needs around each pi call — derived, not invented: the
          # factory's own default pair already provides it — the 480-
          # minute default job timeout minus the 21600-second default pi
          # call cap — 28800 s minus 21600 s = 7200 s, both anchors
          # documented input defaults
          HEADROOM_SECONDS=7200
          PI_CAP="${{ inputs.pi-timeout }}"
          # the same comparison, cap-side view: a declared pi call cap
          # longer than the job timeout minus the headroom fails the
          # run — one trigger-side validation discharges both views
          if ! { [[ "$PI_CAP" =~ ^[0-9]+$ ]] && [ "$JOB_TIMEOUT_SECONDS" -ge $(( PI_CAP + HEADROOM_SECONDS )) ]; }; then
            echo "::error::job timeout ${JOB_TIMEOUT} minutes (${JOB_TIMEOUT_SECONDS} s) does not exceed the resolved pi call cap (${PI_CAP} s) by at least the ${HEADROOM_SECONDS}-second headroom the stage's own non-call work needs around each call — the run fails at trigger time and no stage runs after the trigger"
            exit 1
          fi
          echo "configuration validated: job timeout ${JOB_TIMEOUT} minutes (${JOB_TIMEOUT_SECONDS} s) leaves the ${HEADROOM_SECONDS}-second headroom over the resolved pi call cap (${PI_CAP} s)"
          ISSUE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE")
          mkdir -p "$RUNNER_TEMP/cw"
          jq -r '.body // ""' <<<"$ISSUE_JSON" > "$RUNNER_TEMP/cw/issue-body.md"
          BASE_REF="${{ inputs.target-branch }}"
          BASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE_REF" | jq -r '.commit.sha')
          TITLE=$(jq -r '.title // "(no title)"' <<<"$ISSUE_JSON" | tr '\n' ' ')
          cat > "$RUNNER_TEMP/cw/issue-meta.json" <<EOF
          { "issue": $ISSUE, "title": $(jq -c '.title // ""' <<<"$ISSUE_JSON"), "base_ref": "$BASE_REF", "base_sha": "$BASE_SHA" }
          EOF
          echo "started=true" >> "$GITHUB_OUTPUT"
          echo "base-ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "issue-title=$TITLE" >> "$GITHUB_OUTPUT"
          {
            echo "### Code Weaver — resolved configuration (workflow log; never committed)"
            echo "- issue: #$ISSUE (event: ${{ github.event_name }})"
            echo "- runner: \`${{ inputs.runner }}\`"
                      echo "- runtime tree: the called version's own — fetched from the called repo at the called ref (stage 1 fetched it into $RUNNER_TEMP/cw/stash before the first checkout — the ref's version carries the file and the tree together); one ref is one version, no second pin"
            echo "- LLM model (which configured model): \`${{ inputs.llm-model }}\`"
            echo "- LLM backend: provided for the run (a GitHub secret or the repo file .pi/agent/models.json) — stage 2 writes it for the run"
            echo "- trigger label: \`$AI_REQUIREMENTS_LABEL\`"
            echo "- target branch: \`$BASE_REF\` (base sha $BASE_SHA)"
            echo "- dirs: requirements=\`${{ inputs.requirements-dir }}\` plans=\`${{ inputs.plan-dir }}\` docs=\`${{ inputs.doc-dir }}\`"
            echo "- caps: max-loops=\`${{ inputs.max-loops }}\` (0 = no cap)"
            # the record's job timeout line carries the resolved value —
            # the declared value where a target declared one, the 480
            # default where the input is undeclared: the value the five
            # pi-calling stage jobs run under as their job-level
            # timeout-minutes, validated by the trigger at trigger time
            # (a run that reaches a stage has validated it)
            echo "- job timeout: \`${{ inputs.job-timeout }}\` minutes — the value a target declared for the job-timeout input, or its 480-minute default where the input is undeclared (the 480-minute backstop such a run keeps unchanged)"
            # the record's pi call cap line carries the resolved value —
            # the declared value where a target declared one, the 21600
            # default where the input is undeclared: the exceedance
            # branch is withdrawn — with the validation moved to trigger
            # time, a run whose declared cap leaves the stage's non-call
            # work no headroom inside the job timeout fails before any
            # stage runs, so the record names the resolved cap only
            echo "- pi call cap: \`${{ inputs.pi-timeout }}\` seconds per pi invocation — the value a target declared for the pi-timeout input, or its 21600-second default (the current 360-minute cap) where the input is undeclared"
            if [ -z "${{ inputs.dependency-install }}" ]; then
              echo "- dependency-install: not declared — no project-dependency-install step runs in the pipeline (the run is unchanged)"
            else
              echo "- dependency-install: \`${{ inputs.dependency-install }}\` — the run's pipeline runs it in the consuming stage jobs (implement, test-and-review), after each job's checkout and before its stage"
            fi
            if [ "${{ inputs.dependency-upgrade }}" = "off" ]; then
              echo "- dependency-upgrade: \`off\` — the run's pipeline runs without the dependency-upgrade stage (the run's stages, pull request and final status report are unchanged by the upgrade's absence)"
            else
              echo "- dependency-upgrade: \`${{ inputs.dependency-upgrade }}\` (on by default) — the run's pipeline runs the dependency-upgrade stage before the implementation stage"
            fi
          } | tee -a "$RUNNER_TEMP/cw/resolved-config.txt"
          echo "stage 1 trigger: issue #$ISSUE accepted (event ${{ github.event_name }}, label gate passed)" \
            | tee "$RUNNER_TEMP/cw/stage-summary.txt"
          # state files — every later job reads its trigger values from these
          # (artifact channel), never from the job-outputs relay
          mkdir -p "$RUNNER_TEMP/cw/state/trigger"
          echo "true" > "$RUNNER_TEMP/cw/state/trigger/started.txt"
          echo "$ISSUE" > "$RUNNER_TEMP/cw/state/trigger/issue-number.txt"
          echo "$TITLE" > "$RUNNER_TEMP/cw/state/trigger/issue-title.txt"
          echo "$BASE_REF" > "$RUNNER_TEMP/cw/state/trigger/base-ref.txt"
          echo "$BASE_SHA" > "$RUNNER_TEMP/cw/state/trigger/base-sha.txt"
          # the pr stage's derived input set (head/base/title follow the
          # factory's PR naming from the same resolved values)
          echo "ai/code-weaver/$ISSUE" > "$RUNNER_TEMP/cw/state/trigger/head.txt"
          echo "$BASE_REF" > "$RUNNER_TEMP/cw/state/trigger/base.txt"
          echo "🏭 code-weaver: $TITLE" > "$RUNNER_TEMP/cw/state/trigger/title.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        # the stashed runtime tree under cw/stash/.github/ rides this
        # artifact to every stage job — the tree lives inside a hidden
        # directory (.github), and upload-artifact drops hidden files by
        # default: without the opt-in, every stage job arrives with its
        # stashed stage script missing (run 41126074467 failed exactly
        # this way at stage 2)
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
          include-hidden-files: true

  # ── stage 2 ────────────────────────────────────────────────────────────
  setup-pi:
    name: "2 setup-pi (install pi, configure the run's harness)"
    needs: trigger
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      LLM_MODEL: ${{ inputs.llm-model }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CW_PI_TIMEOUT: ${{ inputs.pi-timeout }}
      # The run's pi harness providers (the documented with: + CW_<name>
      # env relay idiom): an empty secret value arrives empty and the stage
      # treats it as an absent provider — the repo file is the fallback.
      CW_PI_MODELS: ${{ secrets.PI_MODELS }}
      CW_PI_SETTINGS: ${{ secrets.PI_SETTINGS }}
      CW_PI_MCP: ${{ secrets.PI_MCP }}
      CW_PI_EXTENSION_ENV: ${{ secrets.PI_EXTENSION_ENV }}
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # Stage 1 fetched the called version's runtime tree into
        # $RUNNER_TEMP/cw/stash at the called ref and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's state files
        # alongside it — before any checkout replaces the workspace. No
        # second ref to pin, clone or bump: the consumer's uses: line is
        # the only version selection a run makes.
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
      - id: verify
        name: Stage 2 — install pi for the run, configure it from the provided harness
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        working-directory: ${{ github.workspace }}
        # The stage script runs from the stash — the runtime tree this
        # job's first step copied from the called repo at the called ref,
        # before the stage's checkout replaced the workspace with the target.
        # (the step-level env below relays the stage's values;
         #  inlined, that relay is an ordinary step env — the stage's
         #  code resolves each value as INPUT_*, then CW_* env, then
         #  its state file, exactly as across the old boundary.)
        env:
          LLM_MODEL: ${{ inputs.llm-model }}
        run: |-
          S="$RUNNER_TEMP/cw/stash/.github/actions/setup-pi/stage.py"
          [ -f "$S" ] || { echo "::error::stashed stage script $S is missing — the stash step did not run before this step"; exit 1; }
          python3 "$S"
      - name: Stage summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/cw/stage-fail-reason.txt" ]; then
            cat "$RUNNER_TEMP/cw/stage-fail-reason.txt" > "$RUNNER_TEMP/cw/stage-summary.txt"
          else
            echo "stage 2 setup-pi: verified — backend ${{ steps.verify.outputs.backend-url }}, model ${{ steps.verify.outputs.model }}" | tee "$RUNNER_TEMP/cw/stage-summary.txt"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-setup
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
          include-hidden-files: true

  # ── stage 3 ────────────────────────────────────────────────────────────
  baseline:
    name: "3 baseline (ai/code-weaver/<issue>)"
    needs: [trigger, setup-pi]
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CW_PI_TIMEOUT: ${{ inputs.pi-timeout }}
      # ISSUE_NUMBER / CW_BASE_REF / CW_AI_BRANCH arrive via GITHUB_ENV from
      # the trigger artifact (the Read trigger state step) — job-level env is
      # frozen at job start and the job-outputs relay drops values here
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # Stage 1 fetched the called version's runtime tree into
        # $RUNNER_TEMP/cw/stash at the called ref and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's resolved config
        # alongside it — before any checkout replaces the workspace. No
        # second ref to pin, clone or bump: the consumer's uses: line is
        # the only version selection a run makes. The resolved config keeps
        # riding the ARTIFACT (the job-outputs relay has been observed
        # dropping a value for one downstream job while the next received
        # it): the Read trigger state step below feeds GITHUB_ENV from the
        # restored state files.
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw

      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.base-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Stage 3 — cut the AI branch, record the baseline
        shell: /usr/bin/env python3 {0}  # bare "python3" is not a runner-accepted shell form
        working-directory: ${{ github.workspace }}
        run: |
          try:
              import os, subprocess, sys
              action_dir = os.path.join(os.environ.get("RUNNER_TEMP", ""), "cw", "stash", ".github", "actions", "baseline")
              scripts = os.path.join(os.path.dirname(os.path.dirname(action_dir)), "scripts")
              if os.path.isdir(scripts):
                  sys.path.insert(0, scripts)
              try:
                  from common import state_dir, state_file, log
              except ImportError:
                  def state_dir():
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      return d
                  def state_file(n):
                      return os.path.join(state_dir(), n)
                  def log(m):
                      print(m, flush=True)

              # a crashed stage must leave a persistent diagnosis (the job log dies
              # with the run; a ghost run's logs are unreachable from the API) —
              # the full traceback goes to the runner's diag dir + one line to the
              # stage-fail-reason state file the summary/upload steps carry on
              def _cw_persist(stage, dump, value):
                  # one writer for both paths (the explicit try/except wrap and the
                  # excepthook) — the job-visible ::error:: line, the stage-fail-reason
                  # state file (carried on by the summary/upload steps), and the
                  # runner's durable diag log (the job log dies with the run)
                  if globals().get("_cw_persisted"):
                      return
                  globals()["_cw_persisted"] = True
                  try:
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                          f.write(f"stage {stage} FAILED — {value}\n")
                      with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                          f.write(f"=== stage {stage} FAILED ===\n{dump}\n")
                      print(f"::error::stage {stage} failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
                  except Exception:
                      print(f"::error::stage {stage} failed — {value}")

              def _cw_on_uncaught(t, v, tb):
                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("3 baseline", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  # a value that ends in a separator is a mangled derivation
                  # (e.g. an empty issue number in 'ai/code-weaver/') — treat
                  # it as unbound rather than creating a broken ref
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k) or ""
                      if v and v.endswith(("/", ".", "_")):
                          raise SystemExit(
                              f"::error::input '{name}' value {v!r} is a "
                              f"mangled derivation (empty component)")
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              base_ref = _cw_in("base-ref")
              ai_branch = _cw_in("ai-branch")
              repo = os.environ["GITHUB_WORKSPACE"]

              # The factory's single git entry point — one function every
              # git call in the factory's python routes through, so the test
              # suite can mock that one function (a test never spawns the
              # real git binary). This step's python runs in its own
              # interpreter, so it carries its own copy; a test-injected
              # entry point in this script's globals is honoured over it.
              if "git_exec" not in globals():
                  def git_exec(argv, **kw):
                      return subprocess.run(["git"] + list(argv), **kw)

              def g(*args, check=True):
                  r = git_exec(list(args), cwd=repo,
                               capture_output=True, text=True)
                  if check and r.returncode != 0:
                      # surface git's own diagnosis (a bare check=True traceback
                      # hides it in e.stderr) before the uncaught-exception hook
                      # persists everything
                      print(f"::error::git {' '.join(args)} failed (exit {r.returncode}): "
                            f"{r.stderr.strip()[:400]}")
                      raise subprocess.CalledProcessError(r.returncode, ["git", *args],
                                                          output=r.stdout, stderr=r.stderr)
                  return r

              # baseline ref = head of the target branch
              g("fetch", "--no-recurse-submodules", "origin", base_ref)
              base_sha = g("rev-parse", f"origin/{base_ref}").stdout.strip()

              # A NEW run for an issue whose AI branch already exists (the
              # owner's re-trigger after a failed/aborted run) REUSES that
              # branch: every stage runs again, in place, from the branch's
              # current state (the idempotent re-run contract — generated
              # files are updated in place; the guard measures against the
              # baseline ref below, so the accumulated work is what it sees).
              # Only an absent branch is cut fresh from the target — re-cutting
              # would discard the previous run's committed work.
              g("fetch", "--no-recurse-submodules", "origin", ai_branch, check=False)
              if g("rev-parse", f"origin/{ai_branch}", check=False).returncode == 0:
                  resume_sha = g("rev-parse", f"origin/{ai_branch}").stdout.strip()
                  g("checkout", "-B", ai_branch, f"origin/{ai_branch}")
                  log(f"baseline: reusing existing {ai_branch} at {resume_sha} "
                      f"(previous run's work); baseline ref = head of "
                      f"{base_ref} {base_sha}")
              else:
                  g("checkout", "-B", ai_branch, base_sha)
                  log(f"baseline: {ai_branch} cut at {base_sha} (head of "
                      f"{base_ref}); fresh cut")
              g("config", "user.name", "Code Weaver")
              g("config", "user.email", "code-weaver@users.noreply.github.com")

              # the issue's change set, snapshotted as state (empty at a fresh cut —
              # it grows as stages write, and anchors every guard check)
              state = state_dir()
              with open(state_file("baseline.sha"), "w") as f:
                  f.write(base_sha + "\n")
              diff = g("diff", base_sha).stdout
              with open(state_file("baseline.diff"), "w") as f:
                  f.write(diff)

              log(f"baseline: {ai_branch} cut at {base_sha} (head of {base_ref}); "
                  f"baseline diff {len(diff)} bytes → state (not the repo tree)")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"baseline-ref={base_sha}\n")
                  f.write(f"ai-branch={ai_branch}\n")
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("3 baseline", _tb.format_exc(), e)
              raise
      - name: Push the AI branch (a crashed run resumes cleanly)
        run: |
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "ai/code-weaver/${ISSUE_NUMBER}"
      - name: Stage summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/cw/stage-fail-reason.txt" ]; then
            cat "$RUNNER_TEMP/cw/stage-fail-reason.txt" > "$RUNNER_TEMP/cw/stage-summary.txt"
          else
            echo "stage 3 baseline: branch ai/code-weaver/${ISSUE_NUMBER} at ${CW_BASE_SHA}" | tee "$RUNNER_TEMP/cw/stage-summary.txt"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
          include-hidden-files: true
    outputs:
      baseline-ref: ${{ needs.trigger.outputs.base-sha }}
      ai-branch: ai/code-weaver/${{ needs.trigger.outputs.issue-number }}

  # ── stages 4+5 ─────────────────────────────────────────────────────────
  extract:
    name: "4-5 requirement extraction (+ guard)"
    needs: baseline
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job-timeout }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
      PLAN_DIR: ${{ inputs.plan-dir }}
      DOC_DIR: ${{ inputs.doc-dir }}
      LLM_MODEL: ${{ inputs.llm-model }}
      MAX_LOOPS: ${{ inputs.max-loops }}
      CW_PI_TIMEOUT: ${{ inputs.pi-timeout }}
      # ISSUE_NUMBER / AI_BRANCH / BASELINE_REF arrive via
      # GITHUB_ENV from the trigger artifact (Read trigger state)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # Stage 1 fetched the called version's runtime tree into
        # $RUNNER_TEMP/cw/stash at the called ref and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's resolved config
        # alongside it — before any checkout replaces the workspace. No
        # second ref to pin, clone or bump: the consumer's uses: line is
        # the only version selection a run makes. The resolved config keeps
        # riding the ARTIFACT (the job-outputs relay has been observed
        # dropping a value for one downstream job while the next received
        # it): the Read trigger state step below feeds GITHUB_ENV from the
        # restored state files.
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw

      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - name: Stage 4 — extract the delta requirements (Gherkin)
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - name: Requirement-extraction loop (bounded by MAX_LOOPS; 0 = no cap)
        if: ${{ env.CW_STARTED == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        # The stage script runs from the stash — the runtime tree this
        # job's first step copied from the called repo at the called ref,
        # before the stage's checkout replaced the workspace with the target.
        run: |-
          S="$RUNNER_TEMP/cw/stash/.github/actions/extract-stage/stage.py"
          [ -f "$S" ] || { echo "::error::stashed stage script $S is missing — the stash step did not run before this step"; exit 1; }
          python3 "$S"
      - name: Push the AI branch
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${AI_BRANCH}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-extract
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
          include-hidden-files: true

  # ── stages 6+7 ─────────────────────────────────────────────────────────
  plan:
    name: "6-7 planning (+ guard)"
    needs: extract
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job-timeout }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
      PLAN_DIR: ${{ inputs.plan-dir }}
      DOC_DIR: ${{ inputs.doc-dir }}
      LLM_MODEL: ${{ inputs.llm-model }}
      MAX_LOOPS: ${{ inputs.max-loops }}
      CW_PI_TIMEOUT: ${{ inputs.pi-timeout }}
      # ISSUE_NUMBER / AI_BRANCH / BASELINE_REF arrive via
      # GITHUB_ENV from the trigger artifact (Read trigger state)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # Stage 1 fetched the called version's runtime tree into
        # $RUNNER_TEMP/cw/stash at the called ref and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's resolved config
        # alongside it — before any checkout replaces the workspace. No
