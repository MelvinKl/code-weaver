        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - name: Stage 4 — extract the delta requirements (Gherkin)
