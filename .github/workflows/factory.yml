              # stage-fail-reason state file the summary/upload steps carry on
              def _cw_persist(stage, dump, value):
                  # one writer for both paths (the explicit try/except wrap and the
                  # excepthook) — the job-visible ::error:: line, the stage-fail-reason
                  # state file (carried on by the summary/upload steps), and the
                  # runner's durable diag log (the job log dies with the run)
                  if globals().get("_cw_persisted"):
                      return
                  globals()["_cw_persisted"] = True
                  try:
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                          f.write(f"stage {stage} FAILED — {value}\n")
                      with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                          f.write(f"=== stage {stage} FAILED ===\n{dump}\n")
                      print(f"::error::stage {stage} failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
                  except Exception:
                      print(f"::error::stage {stage} failed — {value}")

              def _cw_on_uncaught(t, v, tb):
                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("pi-run (LLM stages)", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              from common import pi_invoke, state_file
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              def _cw_in_opt(name):
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  return None

              prompts = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(action_dir))), "pi-prompts")
              template = _cw_in("template")
              sp = os.path.join(prompts, template + ".md")
              if not os.path.exists(sp):
                  print(f"::error::unknown pi prompt template '{template}' (have: "
                        f"{sorted(os.path.basename(p) for p in os.listdir(prompts)) if os.path.isdir(prompts) else 'none'})")
                  sys.exit(1)
              r = pi_invoke(
                  model=_cw_in("model"),
                  system_prompt_file=sp,
                  prompt_file=_cw_in_opt("prompt-file"),
                  context=(_cw_in_opt("context") or "").split(),
                  timeout=int(_cw_in_opt("timeout") or 1800),
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"pi-exit-code={r.returncode}\n")
                  f.write(f"pi-out-file={state_file('last-pi.out')}\n")
              if r.returncode != 0:
                  sys.exit(1)
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("pi-run (LLM stages)", _tb.format_exc(), e)
              raise
      - name: Assemble the PR body (template fallback — only when pi produced none; stage 15 completes it)
        run: |
          if [ -s "$RUNNER_TEMP/cw/pr-body.md" ]; then
            echo "PR body generated by pi from the requirements, the plan and the review — keeping it"
            exit 0
          fi
          echo "pi produced no body — assembling the template fallback"
          python3 - "$RUNNER_TEMP/cw/pr-body.md" <<'EOF'
          import glob, os, subprocess, sys
          out = sys.argv[1]
          cw = os.path.join(os.environ["RUNNER_TEMP"], "cw")
          repo = os.environ.get("GITHUB_WORKSPACE", ".")

          def trigger_state(name):
              # the trigger's state files are the authoritative channel: this
              # runner build's job-env relay has been observed dropping the
              # CW_* trigger values (a body once opened for 'issue: # —'); the
              # env is the fallback for healthy runners, not the source
              try:
                  v = open(os.path.join(cw, "state", "trigger",
                                        name + ".txt")).read().strip()
              except OSError:
                  v = ""
              return v or os.environ.get("CW_" + name.upper().replace("-", "_"), "")

          issue = trigger_state("issue-number") or "?"
          title = trigger_state("issue-title")
          target = os.environ.get("CW_TARGET", "main")

          # the body describes the issue the run implements — not the
          # configuration the run used (that lives in the workflow log, which
          # the resolved-config file itself marks 'never committed')
          lines = ["# %s" % (title or "AI work for issue #%s" % issue),
                   "",
                   "Opened by the Code Weaver factory — branch "
                   "`ai/code-weaver/%s` → target `%s`. This pull request is "
                   "the run's status report — stage 15 completes it." % (issue, target),
                   "",
                   "## The issue this run implements",
                   "- **Issue:** #%s%s" % (issue, (" — " + title) if title else ""),
                   "- **Target branch:** `%s`" % target,
                   ""]

          # the plan — what the run set out to build, task by task — embedded
          # so the body stands on its own (the plan file is the issue's plan,
          # in the repo)
          plan = os.path.join(repo, os.environ.get("PLAN_DIR", "plans"),
                              issue + ".md")
          if os.path.isfile(plan):
              lines += ["## The plan for this issue", "```markdown"]
              lines += open(plan, encoding="utf-8",
                            errors="replace").read().splitlines()
              lines += ["```", ""]

          # the requirement scenarios the run changed — parsed from the
          # diff's ADDED scenario lines (the delta's shape), not from all
          # the scenarios of a merely touched file
          req_rel = os.environ.get("REQUIREMENTS_DIR", "requirements")
          base = trigger_state("base-sha")
          changed = None
          if base and os.path.isdir(os.path.join(repo, ".git")):
              r = subprocess.run(
                  ["git", "diff", "--name-only", base, "--", req_rel],
                  cwd=repo, capture_output=True, text=True)
              if r.returncode == 0:
                  changed = [l for l in r.stdout.splitlines()
                             if l.endswith(".feature")
                             and os.path.isfile(os.path.join(repo, l))]
          listed = []
          any_diff = False
          if changed is not None:
              for rel in sorted(changed):
                  r = subprocess.run(
                      ["git", "diff", base, "--", rel],
                      cwd=repo, capture_output=True, text=True)
                  if r.returncode != 0 or not r.stdout.strip():
                      continue
                  any_diff = True
                  for ln in r.stdout.splitlines():
                      if ln.startswith("+") and not ln.startswith("+++"):
                          s = ln[1:].strip()
                          for kw in ("Scenario Outline: ", "Scenario: "):
                              if s.startswith(kw):
                                  listed.append("- %s — %s" %
                                                (s[len(kw):].strip(),
                                                 os.path.basename(rel)))
                                  break
              if listed:
                  lines += (["## The requirement scenarios this run changed"]
                             + listed + [""])
              elif any_diff:
                  lines += ["## The requirement scenarios this run changed",
                            "- no scenario title was added — the run's delta "
                            "to the oracle is recorded in the run's artifacts "
                            "(the workflow log)",
                            ""]
              else:
                  lines += ["## The requirement scenarios this run changed",
                            "- the run changed no requirement scenario "
                            "(a vacuous delta)",
                            ""]
          else:
              lines += ["## The requirement scenarios this run changed",
                        "- (the run's delta is recorded in the run's artifacts "
                        "— the workflow log)",
                        ""]

          stages = []
          for f in sorted(glob.glob(os.path.join(cw, "**", "stage-summary.txt"),
                                    recursive=True)):
              stages += [l.strip() for l in open(f) if l.strip()]
          lines.append("## Stage outcomes so far")
          lines += ["- " + l for l in dict.fromkeys(stages)] or ["- (none captured yet)"]
          lines += ["",
                    "_Stage 15 (final status) completes this description with the run's "
                    "outcome, its usage totals and cost — and closes the issue on a "
                    "successful run._"]
          open(out, "w").write("\n".join(lines) + "\n")
          EOF
        env:
          # the state files are the source; the env is the fallback (this
          # runner build's job-env relay has been observed dropping these
          # values — the step reads the trigger's state files first)
          CW_ISSUE: ${{ env.CW_ISSUE_NUMBER }}
          CW_TITLE: ${{ env.CW_ISSUE_TITLE }}
          CW_TARGET: ${{ inputs.target-branch }}
          REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
          PLAN_DIR: ${{ inputs.plan-dir }}
      - id: open-pr
        env:
          CW_BODY_FILE: ${{ runner.temp }}/cw/pr-body.md
        name: Stage 12 — push & open the PR
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - id: open
        env:
          CW_BODY_FILE: ${{ runner.temp }}/cw/pr-body.md
        name: Push the AI branch and open (or update) the PR
        if: ${{ env.CW_STARTED == 'true' }}
        shell: /usr/bin/env python3 {0}  # bare "python3" is not a runner-accepted shell form
        working-directory: ${{ github.workspace }}
        run: |
          try:
              import os, sys, json
              action_dir = os.path.join(os.environ.get("RUNNER_TEMP", ""), "cw", "stash", ".github", "actions", "pr-open")
              scripts = os.path.join(os.path.dirname(os.path.dirname(action_dir)), "scripts")
              if os.path.isdir(scripts):
                  sys.path.insert(0, scripts)
              try:
                  import common
              except ImportError:
                  common = None

              # a crashed stage must leave a persistent diagnosis (the job log dies
              # with the run; a ghost run's logs are unreachable from the API) —
              # the full traceback goes to the runner's diag dir + one line to the
              # stage-fail-reason state file the summary/upload steps carry on
              def _cw_persist(stage, dump, value):
                  # one writer for both paths (the explicit try/except wrap and the
                  # excepthook) — the job-visible ::error:: line, the stage-fail-reason
                  # state file (carried on by the summary/upload steps), and the
                  # runner's durable diag log (the job log dies with the run)
                  if globals().get("_cw_persisted"):
                      return
                  globals()["_cw_persisted"] = True
                  try:
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                          f.write(f"stage {stage} FAILED — {value}\n")
                      with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                          f.write(f"=== stage {stage} FAILED ===\n{dump}\n")
                      print(f"::error::stage {stage} failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
                  except Exception:
                      print(f"::error::stage {stage} failed — {value}")

              def _cw_on_uncaught(t, v, tb):
                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("12 pr-open", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              head, base = _cw_in("head"), _cw_in("base")
              title, body_file, issue = (_cw_in("title"),
                                         _cw_in("body-file"),
                                         _cw_in("issue-number"))
              repo = os.environ["GITHUB_WORKSPACE"]
              token = os.environ.get("GH_TOKEN", "")

              if common:
                  common.push_branch(head)
              else:
                  # minimal push without the shared script (degenerate checkout) —
                  # token rides in the push URL only; the origin remote is untouched
                  import subprocess
                  subprocess.run(
                      ["git", "push", "--force",
                       f"https://x-access-token:{token}@github.com/{os.environ['GITHUB_REPOSITORY']}",
                       head],
                      cwd=repo, check=True,
                      env={k: v for k, v in os.environ.items() if k != "GH_TOKEN"})

              def gh(*a):
                  import subprocess
                  return subprocess.run(["gh", *a], cwd=repo, capture_output=True,
                                        text=True, env={**os.environ, "GH_TOKEN": token})

              # a PR from this head already exists? update it, don't duplicate
              view = gh("pr", "view", head, "--json", "number,url")
              if view.returncode == 0 and view.stdout.strip():
                  pr = json.loads(view.stdout)
                  gh("pr", "edit", str(pr["number"]), "--body-file", body_file)
                  number, url = str(pr["number"]), pr["url"]
              else:
                  cr = gh("pr", "create", "--base", base, "--head", head,
                          "--title", title, "--body-file", body_file)
                  if cr.returncode != 0:
                      print(f"::error::pr create failed: {cr.stderr.strip()[:300]}")
                      sys.exit(1)
                  view = gh("pr", "view", head, "--json", "number,url")
                  pr = json.loads(view.stdout)
                  number, url = str(pr["number"]), pr["url"]

              if common:
                  common.log(f"stage 12: PR #{number} open — {url} (ai-branch {head} → {base})")
              gh("issue", "comment", issue,
                 "--body", f"🏭 **code-weaver** — pull request open: {url}\n\n"
                           f"Base: `{base}` — head: `{head}`. The PR body carries the "
                           f"final status report (stage 15 completes it). Merging is a human decision.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"pr-number={number}\npr-url={url}\n")
              # state files — the gates & report jobs read the PR identity from
              # the artifact (the job-outputs relay is not their value channel)
              st = os.path.join(os.environ.get("RUNNER_TEMP", ""),
                                "cw", "state", "pr")
              os.makedirs(st, exist_ok=True)
              open(os.path.join(st, "pr-number.txt"), "w").write(str(number))
              open(os.path.join(st, "pr-url.txt"), "w").write(url)
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("12 pr-open", _tb.format_exc(), e)
              raise
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-pr
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
    outputs:
      pr-number: ${{ steps.open.outputs.pr-number }}
      pr-url: ${{ steps.open.outputs.pr-url }}

  # ── stages 13+14 ───────────────────────────────────────────────────────
  gates:
    name: "13-14 PR gates (all green; fix loop bounded; never merges)"
    needs: [pr, baseline]
    if: ${{ needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      LLM_MODEL: ${{ inputs.llm-model }}
      REQUIREMENTS_DIR: ${{ inputs.requirements-dir }}
      PLAN_DIR: ${{ inputs.plan-dir }}
      DOC_DIR: ${{ inputs.doc-dir }}
      MAX_LOOPS: ${{ inputs.max-loops }}
      # ISSUE_NUMBER / AI_BRANCH / CW_PR_NUMBER arrive via GITHUB_ENV from
      # the stage artifacts (Read trigger / Read PR state steps)
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The file IS its runtime tree: stage 1 materialised the workflow
        # file's embedded runtime tree into $RUNNER_TEMP/cw/stash and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's resolved config
        # alongside it — before any checkout replaces the workspace. No
        # second ref to pin, clone or bump: the consumer's uses: line is
        # the only version selection a run makes. The resolved config keeps
        # riding the ARTIFACT (the job-outputs relay has been observed
        # dropping a value for one downstream job while the next received
        # it): the Read trigger state step below feeds GITHUB_ENV from the
        # restored state files.
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw

      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: cw-pr
          path: ${{ runner.temp }}/cw
      - name: Read PR state
        run: |
          T="$RUNNER_TEMP/cw/state/pr"
          [ -f "$T/pr-number.txt" ] || { echo "no PR state (the pr stage did not complete)"; exit 0; }
          echo "CW_PR_NUMBER=$(cat "$T/pr-number.txt")" >> "$GITHUB_ENV"
          [ -f "$T/pr-url.txt" ] && echo "CW_PR_URL=$(cat "$T/pr-url.txt")" >> "$GITHUB_ENV"
          echo "pr state: #$(cat "$T/pr-number.txt") $(cat "$T/pr-url.txt" 2>/dev/null)"
      - id: head
        name: Resolve the PR's head sha
        run: |
          # Self-contained on purpose: on this runner build the GITHUB_ENV
          # write from the previous step (Read PR state) has been observed
          # NOT to reach the next step's env — an empty CW_PR_NUMBER here
          # means `pulls//head.sha` → 404 → step failure (deterministic in
          # the re-run of run 40081410050's gates job). The state file is
          # the authoritative relay (the job-outputs binding has the same
          # ghost family); the env stays as fallback for healthy runners.
          PR=$(cat "$RUNNER_TEMP/cw/state/pr/pr-number.txt" 2>/dev/null) || true
          [ -n "$PR" ] || PR="${CW_PR_NUMBER}"
          # The sha comes from the FULL PR object via jq: the field-suffix
          # form of the endpoint (`pulls/<n>/head.sha`) 404s on this API
          # surface — and its 404 body echoed into GITHUB_OUTPUT is an
          # invalid file command, so the step died before the gate loop ever
          # started (run 40219192721's gates job: 4 s from start to death,
          # against a perfectly healthy PR #48 whose full object carried
          # head.sha all along).
          HEAD_SHA=$(gh api repos/$GITHUB_REPOSITORY/pulls/"$PR" --jq .head.sha 2>/dev/null) || true
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::could not resolve the head sha of PR #${PR} — the gates have nothing to poll; check the PR and the token's access to the repo"
            exit 1
          fi
          echo "head-sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - name: Stage 13-14 — wait for every PR-triggered workflow; fix reds
        env:
          CW_HEAD_SHA: ${{ steps.head.outputs.head-sha }}
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - name: Gate loop — all PR-triggered workflows green (bounded; never merges)
        env:
          CW_HEAD_SHA: ${{ steps.head.outputs.head-sha }}
        if: ${{ env.CW_STARTED == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        # The stage script runs from the stash — the runtime tree this
        # job's first step copied from the called repo at the called ref,
        # before the stage's checkout replaced the workspace with the target.
        run: |-
          S="$RUNNER_TEMP/cw/stash/.github/actions/gates-stage/stage.py"
          [ -f "$S" ] || { echo "::error::stashed stage script $S is missing — the stash step did not run before this step"; exit 1; }
          python3 "$S"
      - name: Push the AI branch (post-fix state)
        if: ${{ success() || failure() }}
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${AI_BRANCH}" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-gates
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore

  # ── stage 15 ───────────────────────────────────────────────────────────
  report:
    name: "15 final status report (the PR is the report)"
    needs: [trigger, setup-pi, baseline, extract, plan, implement, review, pr, gates]
    # runs on success AND failure (a run that died early is reported too), but
    # stays silent when the trigger decided no factory run should start
    if: ${{ always() && needs.trigger.outputs.started == 'true' }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DOC_DIR: ${{ inputs.doc-dir }}
      # the run's model configuration rides the report job's env (the
      # factory's with: + CW_<name> env relay idiom — the setup-pi job's
      # env carries the same relay): the report stage prices the run's
      # cost from the same model configuration the setup stage
      # materialised — a non-empty models-configuration secret wins over
      # the repo file .pi/agent/models.json, and the rates the report lists are
      # the ones that configuration declares for the run's resolved model
      CW_PI_MODELS: ${{ secrets.PI_MODELS }}
      # (no ternary in this job's env — a `?` in a reusable workflow's
      # expressions makes the file invalid; the parenthesized &&/|| chain with
      # string literals expresses the same if-else; job-level env stays to
      # factory inputs + the job-result relay — trigger/PR values arrive via
      # GITHUB_ENV from the stage artifacts, which is why the state steps sit
      # where they do)
      CW_RUN_RESULT: "${{ ((contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure') || 'success' }}"
    steps:
      - name: Stash the factory runtime tree (before any checkout replaces the workspace)
        # The file IS its runtime tree: stage 1 materialised the workflow
        # file's embedded runtime tree into $RUNNER_TEMP/cw/stash and rode
        # it on the cw-trigger artifact (that upload runs always()). This
        # download restores the tree — with the trigger's resolved config
        # alongside it — before any checkout replaces the workspace. No
        # second ref to pin, clone or bump: the consumer's uses: line is
        # the only version selection a run makes. The resolved config keeps
        # riding the ARTIFACT (the job-outputs relay has been observed
        # dropping a value for one downstream job while the next received
        # it): the Read trigger state step below feeds GITHUB_ENV from the
        # restored state files.
        uses: actions/download-artifact@v8
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw

      - id: state
        name: Read trigger state
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          [ -f "$T/started.txt" ] || { echo "::error::no trigger state under $T (empty artifact?)"; exit 1; }
          # read into shell vars first: GITHUB_ENV feeds the LATER steps, not
          # this shell — deriving from $CW_* here would export empty values
          V_STARTED=$(cat "$T/started.txt" 2>/dev/null)
          V_ISSUE=$(cat "$T/issue-number.txt" 2>/dev/null)
          V_TITLE=$(cat "$T/issue-title.txt" 2>/dev/null)
          V_BASE_REF=$(cat "$T/base-ref.txt" 2>/dev/null)
          V_BASE_SHA=$(cat "$T/base-sha.txt" 2>/dev/null)
          { [ -n "$V_ISSUE" ] && [ -n "$V_BASE_SHA" ]; } || { echo "::error::trigger state incomplete (issue=[$V_ISSUE] base_sha=[$V_BASE_SHA])"; exit 1; }
          for k in started issue-number issue-title base-ref base-sha head title base; do
            v=$(cat "$T/$k.txt" 2>/dev/null || true)
            [ -n "$v" ] && printf '%s=%s\n' "CW_$(tr a-z A-Z <<<"$k")" "$v" >> "$GITHUB_ENV"
          done
          echo "AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "CW_AI_BRANCH=ai/code-weaver/$V_ISSUE" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=$V_ISSUE" >> "$GITHUB_ENV"
          echo "BASELINE_REF=$V_BASE_SHA" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT — the checkout steps take their refs from this step
          # output, not from the env context: on this runner build the env
          # context does not reliably see GITHUB_ENV entries in a later step's
          # expression (observed: baseline's checkout got the value, extract's
          # did not, from the same file); a step's own outputs are the
          # deterministic in-job relay
          echo "checkout-ref=ai/code-weaver/$V_ISSUE" >> "$GITHUB_OUTPUT"
          echo "base-ref=$V_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "trigger state: started=$V_STARTED issue=$V_ISSUE title=$V_TITLE base=$V_BASE_REF@$V_BASE_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.state.outputs.checkout-ref || steps.state.outputs.base-ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-trigger
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-setup
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-baseline
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-extract
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-plan
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-implement
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-review
          path: ${{ runner.temp }}/cw
      - uses: actions/download-artifact@v8
        continue-on-error: true  # an upstream stage that never ran never uploads its artifact; the report lists it as not-run
        with:
          name: cw-gates
          path: ${{ runner.temp }}/cw

      - name: Read PR state
        run: |
          T="$RUNNER_TEMP/cw/state/pr"
          [ -f "$T/pr-number.txt" ] || { echo "no PR state (the pr stage did not complete)"; exit 0; }
          echo "CW_PR_NUMBER=$(cat "$T/pr-number.txt")" >> "$GITHUB_ENV"
          [ -f "$T/pr-url.txt" ] && echo "CW_PR_URL=$(cat "$T/pr-url.txt")" >> "$GITHUB_ENV"
          echo "pr state: #$(cat "$T/pr-number.txt") $(cat "$T/pr-url.txt" 2>/dev/null)"
      - name: Stage 15 — PR body = final status; issue comment; arc42 activity
        # The guard judges THIS stage's work only: earlier stages' committed
        # outputs must not look like off-limits changes against the trigger's
        # base sha.
        # shell: is declared on every script step — this runner build's
        # manifest loader rejects a composite step that has run: but no
        # shell: (v2.338: "Required property is missing: shell").
        shell: bash
        run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
      - name: Write the final status report (PR body + issue comment + arc42 activity)
        shell: /usr/bin/env python3 {0}  # bare "python3" is not a runner-accepted shell form
        working-directory: ${{ github.workspace }}
        run: |
          try:
              import os, sys, glob, json, datetime
              action_dir = os.path.join(os.environ.get("RUNNER_TEMP", ""), "cw", "stash", ".github", "actions", "report")
              scripts = os.path.join(os.path.dirname(os.path.dirname(action_dir)), "scripts")
              if os.path.isdir(scripts):
                  sys.path.insert(0, scripts)
              try:
                  import common
                  # import path — the shared module resolved from the stashed
                  # runtime tree: bind the body's five bare-name plumbing calls
                  # (the state dir, the state file, the log, the gh api, the
                  # branch push) to the shared module's definitions, so the
                  # body's bare-name calls resolve on that path and the step
                  # completes its report instead of dying with an
                  # undefined-name error before any of its report work; a
                  # runner where the module does not resolve falls through to
                  # the ImportError branch below, whose local fallback
                  # definitions bind the same names
                  state_dir = common.state_dir
                  state_file = common.state_file
                  log = common.log
                  gh_api = common.gh_api
                  push_branch = common.push_branch
              except ImportError:
                  def state_dir():
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      return d
                  def state_file(n):
                      return os.path.join(state_dir(), n)
                  def log(m):
                      print(m, flush=True)
                  def gh_api(p, accept="application/vnd.github+json", data=None):
                      import subprocess
                      env = {**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN", "")}
                      args = ["gh", "api", "-H", f"Accept: {accept}"]
                      if data is not None:
                          args += ["-f", f"body={data}"]
                      args.append(p)
                      r = subprocess.run(args, capture_output=True, text=True, env=env)
                      if r.returncode != 0:
                          raise RuntimeError(r.stderr.strip()[:300])
                      return r.stdout
                  def push_branch(branch, force=True):
                      import subprocess
                      token = os.environ.get("GH_TOKEN", "")
                      subprocess.run(["git", "push", "--force",
                                      f"https://x-access-token:{token}@github.com/{os.environ['GITHUB_REPOSITORY']}", branch],
                                     cwd=os.environ["GITHUB_WORKSPACE"], check=True,
                                     env={k: v for k, v in os.environ.items() if k != "GH_TOKEN"})

              # a crashed stage must leave a persistent diagnosis (the job log dies
              # with the run; a ghost run's logs are unreachable from the API) —
              # the full traceback goes to the runner's diag dir + one line to the
              # stage-fail-reason state file the summary/upload steps carry on
              def _cw_persist(stage, dump, value):
                  # one writer for both paths (the explicit try/except wrap and the
                  # excepthook) — the job-visible ::error:: line, the stage-fail-reason
                  # state file (carried on by the summary/upload steps), and the
                  # runner's durable diag log (the job log dies with the run)
                  if globals().get("_cw_persisted"):
                      return
                  globals()["_cw_persisted"] = True
                  try:
                      d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                      os.makedirs(d, exist_ok=True)
                      with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                          f.write(f"stage {stage} FAILED — {value}\n")
                      with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                          f.write(f"=== stage {stage} FAILED ===\n{dump}\n")
                      print(f"::error::stage {stage} failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
                  except Exception:
                      print(f"::error::stage {stage} failed — {value}")

              def _cw_on_uncaught(t, v, tb):
                  import traceback as _tb
                  # the hook receives (type, value, traceback) from the interpreter —
                  # sys.exc_info() is already cleared by the time it runs, so the
                  # arguments are the source of truth; format_exc() is the fallback
                  if tb is not None:
                      dump = "".join(_tb.format_exception(t, v, tb))
                  else:
                      dump = _tb.format_exc()
                      if not dump.strip() or dump.strip() == "NoneType: None":
                          dump = f"(no exception context at hook time — type: {t!r}, value: {v!r})"
                  _cw_persist("15 report", dump, v)
                  raise SystemExit(1)
              sys.excepthook = _cw_on_uncaught
              def _cw_in(name):
                  # INPUT_<name> (a healthy runner's action-input binding) or
                  # CW_<name> (the job/step env the factory sets — on this
                  # runner build, composite actions' with: values never reach
                  # the inner steps as INPUT_* at all; see probe v4)
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  # state files — this runner build's composite-action inner
                  # steps also miss the job-level GITHUB_ENV values, so the
                  # files the triggering stage wrote into the artifact are
                  # the authoritative source
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  raise SystemExit(
                      f"::error::input '{name}' unbound (no INPUT_{n}, "
                      f"no CW_{n}, no state file)")
              def _cw_in_opt(name):
                  n = name.upper().replace("-", "_")
                  for k in (f"INPUT_{n}", f"CW_{n}"):
                      v = os.environ.get(k)
                      if v:
                          return v
                  import pathlib
                  for d in ("trigger", "pr"):
                      f = pathlib.Path(os.environ.get("RUNNER_TEMP", "")) / "cw" / "state" / d / (name + ".txt")
                      if f.is_file():
                          v = f.read_text().strip()
                          if v:
                              return v
                  return None
              repo = os.environ["GITHUB_WORKSPACE"]
              result = _cw_in("run-result")
              pr = (_cw_in_opt("pr-number") or "").strip()
              issue = _cw_in("issue-number")
              now = datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%d %H:%M UTC")

              # merge every stage's summary line (the jobs downloaded their
              # cw-* state artifacts into the state dir before calling us)
              stage_lines = []
              for f in sorted(glob.glob(os.path.join(state_dir(), "**", "stage-summary.txt"), recursive=True)):
                  for line in open(f):
                      if line.strip() and line.strip() not in stage_lines:
                          stage_lines.append(line.strip())
              stage_table = "\n".join(f"- {l}" for l in stage_lines) or "- (no stage summaries captured)"
              # run usage & cost for the final status report — assembled from
              # the per-call usage records in the state dir: one tokens.txt
              # line per pi call carrying the call's input and output token
              # counts (the shared pi-call plumbing appends a record as each
              # call finishes, and the record travels with the run's state
              # artifacts like every other stage value). Each stage's artifact
              # carries the cumulative ledger, and the report job downloads the
              # stages' artifacts in pipeline order — the ledger surviving the
              # downloads is the complete one: it covers every pi call the run
              # made, and a stage that never ran (its artifact never uploaded)
              # contributes nothing
              tot_in = tot_out = 0
              have_usage = False
              led = state_file("tokens.txt")
              if os.path.isfile(led):
                  for line in open(led, encoding="utf-8", errors="replace"):
                      p = line.split()
                      if len(p) != 2:
                          continue
                      try:
                          i, o = int(p[0]), int(p[1])
                      except ValueError:
                          continue
                      tot_in += i
                      tot_out += o
                      have_usage = True
              # the total cost is derived from the recorded usage, keyed on the
              # run's resolved model — the llm-model setting, the only
              # documented adjustable LLM setting; its resolved value rides the
              # trigger's resolved-config state, which the report job downloads
              # first. The rates come from the run's model configuration itself
              # — the provider the setup stage materialised (a non-empty
              # models-configuration secret wins over the repo file
              # .pi/agent/models.json, which this job resolves the same way): the per-model `cost`
              # object in its models.json entry carries the USD-per-1M-tokens
              # rates, and the report lists the rates used with the source it
              # read them from, so the listed cost is auditable and consistent
              # with the recorded usage; a model the configuration carries no
              # cost entry for is listed as unpriced
              model = ""
              cfg = state_file("resolved-config.txt")
              if os.path.isfile(cfg):
                  for line in open(cfg, encoding="utf-8", errors="replace"):
                      if line.startswith("- LLM model"):
                          p = line.split("`")
                          if len(p) >= 2:
                              model = p[1].strip()
                          break
              # the run's model configuration — resolved the way the setup
              # stage resolves it: a non-empty models-configuration secret
              # (the CW_ relay this job's env carries) wins over the repo
              # file .pi/agent/models.json in the workspace
              models_raw = _cw_in_opt("pi-models")
              models_source = ("the run's model configuration (a GitHub secret)"
                                if models_raw
                                else "the repo file .pi/agent/models.json")
              if not models_raw:
                  fp = os.path.join(os.environ.get("GITHUB_WORKSPACE") or ".",
                                    ".pi", "agent", "models.json")
                  if os.path.isfile(fp):
                      try:
                          with open(fp, encoding="utf-8") as f:
                              models_raw = f.read()
                      except OSError:
                          models_raw = None
              # USD per 1M tokens for the resolved model — the `cost`
              # object of its models.json entry (input, output,
              # cacheRead, cacheWrite). The usage ledger records input and
              # output only, so the cost is the input/output part of it
              r_in = r_out = None
              if models_raw:
                  try:
                      data = json.loads(models_raw)
                  except Exception:
                      data = None
                  if data is not None:
                      def _walk(o):
                          # the providers' models lists — the same shape the
                          # setup stage's model-set check walks
                          if isinstance(o, dict):
                              for k, v in o.items():
                                  if k == "models" and isinstance(v, list):
                                      for m in v:
                                          yield m
                                  else:
                                      yield from _walk(v)
                          elif isinstance(o, list):
                              for v in o:
                                  yield from _walk(v)
                      for m in _walk(data):
                          if isinstance(m, dict) and m.get("id") == model:
                              c = m.get("cost")
                              if isinstance(c, dict):
                                  try:
                                      r_in = float(c.get("input"))
                                      r_out = float(c.get("output"))
                                  except (TypeError, ValueError):
                                      r_in = r_out = None
                              break
              if not have_usage:
                  usage_lines = ("- **Total input tokens:** 0\n"
                                 "- **Total output tokens:** 0\n"
                                 "- **Total cost:** $0.00 (no pi call recorded usage)")
              elif r_in is None or r_out is None:
                  usage_lines = (f"- **Total input tokens:** {tot_in}\n"
                                 f"- **Total output tokens:** {tot_out}\n"
                                 f"- **Total cost:** unpriced (model `{model}` "
                                 "has no cost rates in the run's model "
                                 "configuration — put the model's cost rates "
                                 "in .pi/agent/models.json (or the models-"
                                 "configuration secret))")
              else:
                  usage_lines = (f"- **Total input tokens:** {tot_in}\n"
                                 f"- **Total output tokens:** {tot_out}\n"
                                 f"- **Total cost:** ${(tot_in * r_in + tot_out * r_out) / 1e6:.4f} "
                                 f"(model `{model}` @ ${r_in:.2f}/M input, ${r_out:.2f}/M output — "
                                 f"rates from {models_source})")

              if pr:
                  view = json.loads(gh_api(
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr}"))
                  body = view.get("body") or ""
                  head = view["head"]["sha"]
                  final = (body.split("\n## Final status")[0]
                           + "\n## Final status\n"
                           + f"- **Run result:** {result}\n- **Completed:** {now}\n"
                           + f"- **AI branch:** `{view['head']['ref']}` @ `{head[:12]}`\n"
                           + f"- **Source issue:** #{issue}\n"
                           + usage_lines + "\n"
                           + "### Stage outcomes\n" + stage_table + "\n"
                           + "\n_Merging this PR is a human decision — the factory never merges._\n")
                  import subprocess
                  with open(state_file("final-pr-body.md"), "w") as f:
                      f.write(final)
                  subprocess.run(["gh", "pr", "edit", pr, "--body-file", state_file("final-pr-body.md")],
                                 cwd=repo, env={**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN", "")},
                                 check=False)
                  # the completion must be VERIFIED on the PR before the
                  # comment claims 'final status is in the PR body': gh pr edit
                  # is a GraphQL mutation a PR that was merged in the meantime
                  # refuses — and check=False would swallow that, leaving an
                  # issue comment claiming the description carries the final
                  # status it never got (the PR description would then disagree
                  # with the usage numbers the issue comment posts). Re-read the
                  # PR: its body must carry the completion.
                  def _body_landed():
                      try:
                          again = json.loads(gh_api(
                              f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr}"))
                      except Exception as e:
                          log(f"stage 15: could not re-read PR #{pr} after the edit: "
                              f"{str(e).strip()[:120]}")
                          return False
                      return "\n## Final status" in (again.get("body") or "")
                  completed = _body_landed()
                  if not completed:
                      # the REST edit is a different write path than the GraphQL
                      # mutation — a merged PR's description can still be edited
                      # over REST; try it, then verify again. If it still does
                      # not land, the comment below is self-contained.
                      log(f"stage 15: PR #{pr} body did not take the completion — "
                          f"trying the REST edit")
                      subprocess.run(["gh", "api", "-X", "PATCH",
                                      f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr}",
                                      "-f", f"body={final}"],
                                     cwd=repo, capture_output=True, text=True,
                                     env={**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN", "")})
                      completed = _body_landed()
                  # the arc42 docs get the AI-activity section (docs changes are
                  # within the implementation allow-set — this commit is the
                  # report stage's own, made after the guards have run)
                  doc_dir = (os.environ.get("DOC_DIR") or "").strip().rstrip("/")
                  entry = (f"\n### {now} — code-weaver run for issue #{issue}\n"
                           f"- result: {result}\n- PR: {pr}\n"
                           + usage_lines + "\n"
                           + "- stages:\n"
                           + "\n".join(f"  - {l}" for l in stage_lines) + "\n")
                  touched = False
                  # arc42 activity commits only land on the AI branch — if the run
                  # died before the branch existed, the checkout is at the base ref
                  # and the target tree must stay untouched
                  on_ai_branch = subprocess.run(["git", "branch", "--show-current"], cwd=repo,
                                                capture_output=True, text=True).stdout.strip() \
                      == os.environ.get("AI_BRANCH", "")
                  if on_ai_branch:
                      if doc_dir and os.path.isdir(doc_dir):
                          arc42_files = sorted(glob.glob(
                              os.path.join(doc_dir, "**", "*.md"), recursive=True))
                      elif os.path.isfile("PLAN.md"):
                          # a repo without a doc dir documents itself in its
                          # top-level arc42 markdown — fall back to it so the
                          # AI-activity section still lands on the arc42 set
                          arc42_files = [os.path.join(repo, "PLAN.md")]
                      else:
                          arc42_files = []
                      for md in arc42_files:
                          text = open(md).read()
                          marker = "## AI activity (code-weaver)"
                          if marker in text:
                              text = text.rstrip("\n") + entry
                          elif text:
                              text = text.rstrip("\n") + f"\n\n{marker}\n" + entry
                          else:
                              text = f"{marker}\n" + entry
                          open(md, "w").write(text)
                          touched = True
                          break  # the first arc42 file carries the activity log
                  if touched:
                      subprocess.run(["git", "add", "-A"], cwd=repo, check=True)
                      st = subprocess.run(["git", "status", "--porcelain"], cwd=repo,
                                          capture_output=True, text=True)
                      if st.stdout.strip():
                          subprocess.run(["git", "commit", "-q", "-m", "report: AI-activity recorded"],
                                         cwd=repo, check=True)
                          push_branch(os.environ.get("AI_BRANCH", ""))
                  url = view.get("html_url", "")
                  ok = result == "success"
                  # a successful run closes the issue it was working on: the
                  # work is done, the PR is the remaining human gate, and a
                  # closed issue stays out of the trigger's lane. A failed run
                  # leaves the issue open for a re-trigger. The close is
                  # best-effort — a refusal (e.g. a token without the scope)
                  # must not sink the report that already landed
                  closed = None
                  if ok:
                      r = subprocess.run(["gh", "api", "-X", "PATCH",
                                          f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}",
                                          "-f", "state=closed",
                                          "-f", "state_reason=completed"],
                                         capture_output=True, text=True,
                                         env={**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN", "")})
                      closed = r.returncode == 0
                      if not closed:
                          log(f"::warning::stage 15: could not close issue #{issue}: "
                              f"{r.stderr.strip()[:120]}")
                  close_note = ("closed — the run succeeded" if closed is True else
                                "close refused — the run succeeded, but the issue "
                                "stays open (see the workflow log)" if closed is False else
                                "left open — re-trigger to retry")
                  if ok and completed:
                      data = ("✅ **code-weaver run finished** — final status is in the PR body.\n"
                              f"- result: **{result}**\n- completed: {now}\n"
                              f"- pull request: {url}\n- source: #{issue} ({close_note})\n"
                              f"{usage_lines}\n")
                  elif ok:
                      # the completion could not be applied to the description
                      # (the PR was already merged, or the edit was refused on
                      # both write paths): the comment then carries the full
                      # final status itself — the same usage numbers and stage
                      # outcomes the PR body was to get — and makes no claim
                      # that the PR body carries them
                      data = ("✅ **code-weaver run finished** — the PR body could not be "
                              "completed (the PR was already merged or the edit was "
                              "refused), so this comment carries the full final status.\n"
                              f"- result: **{result}**\n- completed: {now}\n"
                              f"- pull request: {url}\n- source: #{issue} ({close_note})\n"
                              + usage_lines + "\n"
                              + "### Stage outcomes\n" + stage_table + "\n")
                  else:
                      data = (f"❌ **code-weaver run failed** — the pull request is incomplete.\n"
                              f"- result: **{result}**\n- completed: {now}\n"
                              f"- pull request: {url}\n- source: #{issue} ({close_note})\n"
                              f"- stage outcomes:\n{stage_table}\n"
                              f"{usage_lines}\n")
                  gh_api(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}/comments",
                         data=data)
                  log(f"stage 15: PR #{pr} body completion "
                      f"{'verified on the PR' if completed else 'NOT applied — the issue comment is self-contained'}; "
                      f"issue #{issue} {'closed' if closed else 'left open'}; "
                      f"arc42 activity {'recorded' if touched else 'n/a'}")
              else:
                  gh_api(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}/comments",
                         data=("❌ **code-weaver run failed** before a pull request could "
                               "be opened.\n"
                               f"- result: **{result}**\n- completed: {now}\n"
                               f"- stage outcomes:\n{stage_table}\n"
                               f"{usage_lines}\n"
                               "- full logs: the workflow run's artifacts (the repo tree "
                               "is never used for report files).\n"))
                  log(f"stage 15: no PR — failure reported on issue #{issue} "
                      f"(stage outcomes: {len(stage_lines)} line(s))")
          except SystemExit:
              raise
          except BaseException as e:
              # explicit wrap: inside this handler the exception
              # context is alive, so the persisted traceback is always
              # complete; the excepthook below is the backstop
              import traceback as _tb
              _cw_persist("15 report", _tb.format_exc(), e)
              raise
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cw-report
          path: ${{ runner.temp }}/cw
          if-no-files-found: ignore
