        # of the factory's runtime tree. So the tree the inlined stage steps
        # execute (the .github scripts, the stage scripts, the pi prompt
        # templates) is copied to $RUNNER_TEMP first — RUNNER_TEMP survives
        # every later checkout, and the repo-relative layout is preserved, so
        # the scripts' __file__-relative imports keep resolving. Same-repo and
        # cross-repo runs take this one identical path: no GITHUB_ACTION_PATH
        # guessing, no action boundary, no own-action refs.
