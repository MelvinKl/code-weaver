name: code-weaver
on:
  issues:            # only a label addition starts a run — opening or editing no longer fires it
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number: { description: Issue to process, type: string, required: false }
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  factory:
    # a reusable-workflow job may only carry `uses`/`with`/`secrets` — a
    # `runs-on:` here makes the file schema-invalid. The runner is chosen
    # through the factory's `runner` input instead (every factory job runs on
    # it; pi is not a pre-requisite of its environment — stage 2 installs
    # and configures pi for the run).
    # This repo IS the factory project — and its consumer workflow uses
    # the same shape as its external targets: it pins the PUBLIC release
    # line — uses: MelvinKl/code-weaver/.github/workflows/factory.yml at
    # a version tag. The dogfood thereby exercises exactly the published
    # version the external targets get — a broken release breaks the
    # dogfood visibly. A run triggered here still checks out and works
    # the code of the repo it was triggered in — the pin selects the
    # machinery (the workflow file and its runtime tree as one published
    # version), never the code: each stage job materialises the runtime
    # tree of the pinned version — the tagged version's tree, kept
    # consistent with the file by the release flow's publication gate —
    # and runs its stage steps from that copy (the first job fetches the
    # called version's tree from the factory repo at the ref that
    # selected the file — the consumer's uses: line stays the only pin,
    # and the (legacy) factory-ref input stays undeclared, no stage
    # reading a relayed ref; requirements/reuse-by-ref.feature, "a run
    # triggered in the factory's own repo works on that repo's code").
    # Bumping the tag number is the dogfood's upgrade — one tag is one
    # complete version, and the release flow's one-tag-per-commit guard
    # keeps the series one commit per number. A bump like this one
    # changes only this file, so the release flow's changed-files check
    # — run pre-publish, and again inside the publish step over the
    # committed tree, because a run's push metadata is not a contract
    # — skips it: no number is spent on a version this file does not
    # belong to.
    uses: MelvinKl/code-weaver/.github/workflows/factory.yml@32
    with:
      max-loops: 25
      issue-number: ${{ github.event.issue.number || inputs.issue_number }}
      ai-requirements-label: ai-requirements
      target-branch: main
      llm-model: Qwen3.8  # which configured model — the one adjustable LLM setting
      runner: code-weaver   # runner label the stage jobs run on (pi is installed &
      # configured for the run by stage 2). The runner must sit on the
      # dogfood's network: stage 2's smoke check probes the run's LLM
      # backend, and the dogfood's harness points at a backend on the
      # private LAN — a hosted cloud runner cannot address it (run #158:
      # the stage installed and resolved its pi on a pristine hosted
      # runner, then failed on "backend unreachable: http://192.168.5.202
      # :8080/v1" — the stage machinery is runner-agnostic, the backend
      # is not). The self-hosted runner (build 2.338.0) in turn has a
      # workflow-parser that drops one of the factory's ten jobs on the
      # current file (runs #155/#156 — the verbatim file parses to ten
      # jobs under standard YAML engines and on a latest hosted runner,
      # and every file-side cut bisected clean: the defect is the
      # runner build's parser — issue #117). The
      # dogfood re-runs on this label once that runner is upgraded; a
      # run its ceiling kills resumes cleanly on re-trigger — the branch
      # persists.
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}   # repo-scoped; never a plain input
      # the run's pi harness providers — optional: an unset secret arrives
      # empty and stage 2 treats it as an absent provider (the repo's
      # .pi/agent/models.json, .pi/settings.json and .pi/mcp.json are the
      # fallbacks); never a plain input
      PI_MODELS: ${{ secrets.PI_MODELS }}
      PI_SETTINGS: ${{ secrets.PI_SETTINGS }}
      PI_MCP: ${{ secrets.PI_MCP }}
      PI_EXTENSION_ENV: ${{ secrets.PI_EXTENSION_ENV }}
