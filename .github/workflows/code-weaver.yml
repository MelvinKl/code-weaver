name: code-weaver
on:
  issues:            # editing an issue to add the label starts a run
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number: { description: Issue to process, type: string, required: false }
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  factory:
    # a reusable-workflow job may only carry `uses`/`with`/`secrets` — a
    # `runs-on:` here makes the file schema-invalid. The runner is chosen
    # through the factory's `runner` input instead (every factory job runs on
    # it, so its environment must have pi pre-installed & configured).
    uses: MelvinsPersonalProjects/code-weaver/.github/workflows/factory.yml@main
    with:
      issue-number: ${{ github.event.issue.number || inputs.issue_number }}
      ai-requirements-label: ai-requirements
      target-branch: main
      llm-model: Qwen3.8        # which configured model — the one adjustable LLM setting
      runner: gha-beryllium      # runner label whose environment has pi pre-installed & configured
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}   # repo-scoped; never a plain input
