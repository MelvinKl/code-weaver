name: code-weaver
on:
  issues:            # only a label addition starts a run — opening or editing no longer fires it
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number: { description: Issue to process, type: string, required: false }
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  factory:
    # a reusable-workflow job may only carry `uses`/`with`/`secrets` — a
    # `runs-on:` here makes the file schema-invalid. The runner is chosen
    # through the factory's `runner` input instead (every factory job runs on
    # it; pi is not a pre-requisite of its environment — stage 2 installs
    # and configures pi for the run).
    # This repo IS the factory project — a run triggered in it must check
    # and work the code of the repo it was triggered in, never a clone of
    # the factory repo at a pinned ref (the public release line the external
    # targets pin). The job therefore calls THIS repo's own copy of the
    # factory workflow — a relative uses: (the runner reads the file from
    # the triggering commit). The file's embedded runtime tree is the
    # repo's own tree at that commit (the embed's contract test keeps it
    # fresh: a commit whose file carries a stale tree fails the suite), so
    # the run's workflow file and the runtime tree its stage steps execute
    # are one version — the triggered repo's own (requirements/reuse-by-ref.feature,
    # "a run triggered in the factory's own repo works on that repo's code").
    # The (legacy) factory-ref input stays undeclared — no stage reads it
    # anymore; the file carries its runtime tree embedded.
    # External targets keep the pinned-tag pattern instead:
    # uses: MelvinKl/code-weaver/.github/workflows/factory.yml at a version
    # tag — one pin: the file carries its runtime tree, so no relayed
    # ref accompanies it.
    uses: ./.github/workflows/factory.yml
    with:
      max-loops: 25
      issue-number: ${{ github.event.issue.number || inputs.issue_number }}
      ai-requirements-label: ai-requirements
      target-branch: main
      llm-model: Qwen3.8  # which configured model — the one adjustable LLM setting
      runner: self-hosted      # runner label the stage jobs run on (pi is installed & configured for the run by stage 2)
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}   # repo-scoped; never a plain input
      # the run's pi harness providers — optional: an unset secret arrives
      # empty and stage 2 treats it as an absent provider (the repo's
      # .pi/agent/models.json, .pi/settings.json and .pi/mcp.json are the
      # fallbacks); never a plain input
      PI_MODELS: ${{ secrets.PI_MODELS }}
      PI_SETTINGS: ${{ secrets.PI_SETTINGS }}
      PI_MCP: ${{ secrets.PI_MCP }}
      PI_EXTENSION_ENV: ${{ secrets.PI_EXTENSION_ENV }}
