# Code Weaver — release machinery (reuse-by-ref)
#
# A push to main publishes a GitHub release: the ref every target pins.
# The tag points at main's HEAD — the commit the push just delivered,
# which is already on the remote — so the tag push uploads only the tag
# object: no new commit content, no workflow-file update in the push, and
# the default GITHUB_TOKEN (the `github-actions` GitHub App, scoped by the
# permissions block below) can publish it. No special token, no secret:
# the flow needs `contents: write` for the tag ref and the release
# object, and nothing else. (The App can never be granted the `workflows`
# permission — that is not a scope available to it — so the flow must
# never push a commit that updates a workflow file; it never does.)
#
# A re-run of the flow is a no-op: before cutting, the publish step
# asks the shared-plumbing helper whether main's HEAD already carries a
# numbered tag and, where it does, exits without publishing — one tag
# per commit, the version series advancing only when main does. A
# duplicate version (a number spent on a commit already tagged) is what
# a consumer pin written for that number would otherwise land on.
#
# The one push the flow does not publish: a push to main whose changed
# files are confined to the consumer's own workflow file
# (.github/workflows/code-weaver.yml — the target's only per-target
# code). A version is the factory workflow and its runtime tree as one
# published version — never the consumer's own workflow file — so such
# a push changes nothing a published version carries: the pre-publish
# step (between the publication gate and Publish below) asks the
# shared-plumbing
# helper whether the push's changed files are confined to that file and,
# where they are, records its skip on a step output the Publish step's
# if: reads — a step's zero exit ends that step only, and a step exit
# never stops the job (the flow's next step runs regardless), so the
# skip cannot be the exit itself; the output is what keeps the Publish
# step from running — no number materialised, no tag created, no
# release published, no number spent on a version whose content did
# not change. The Publish step itself carries the same predicate as a
# payload-independent backstop — a run's event metadata is not a
# contract, so the publish re-asks the helper over the committed
# tree's range-base → HEAD diff and a version whose diff from its
# predecessor is confined to that file publishes nothing there either.
# The trigger still fires on every main
# advance — the skip is the no-op discipline above applied to a push
# that changes nothing a version carries.
#
# A published version is the factory workflow file and its runtime tree
# (the .github scripts, the stage scripts, the pi prompt templates) as
# one: the file is plain text, within the max allowed size (at most
# 500kb), and the tagged commit's tree carries the runtime tree the
# file's stage steps execute. The tag needs no pre-tag rewrite of
# anything: there are no own-action refs left to rewrite, and nothing
# to fetch into the file (the file stores no binary content) — the tree
# the run executes is the one the tagged commit carries. A target pins
# the version exactly once — its uses: ref: the ref's published version
# carries the file and the tree together — and no stage reads a
# relayed ref, because there is no second ref to relay. The rewrite the
# old design did at release time (on a throwaway branch, a push the
# publishing principal is refused) is gone: this flow's role in the
# version is the publication gate — the steps below check the committed
# file and the committed tree for consistency, and the committed file's
# structure: a file a standard engine cannot parse, a step that declares
# keys after its run block (the shape the runner's workflow parser
# diverges on — the one that dropped a stage job from the run's job
# graph and phantom-stepped every other job), or a run block past the
# giant-body budget. A version that is not consistent — a file that is
# not plain text or is past 500kb, a tagged commit whose tree carries no
# runtime tree the file's stage steps execute, or a file whose structure
# the runner's parser mis-reads — is not published, before the tag, with
# the exact cause. The gate governs versions published from this change
# on:
# versions published before it keep the embedded form — those files are
# immutable published artifacts that still decode their own tree — so
# every published version is self-sufficient under its own mechanism
# and no cross-version coupling is introduced. Tags are immutable: a
# target that pinned an older ref keeps working; upgrading is a
# one-line ref bump in the target's workflow.
#
# One machinery note: the `gh` CLI refuses to run inside a GitHub Actions
# job unless `GH_TOKEN` is set in the step env (it does not fall back to
# `GITHUB_TOKEN` — run 40674136956's exit 4). The Publish step maps it to
# the `github.token` context, which IS that same default token: the
# principal is unchanged, no secret is read, the flow stays tokenless.
name: code-weaver release

on:
  push:
    branches: [main]
  # Manual trigger: re-run from the Actions UI (or `gh workflow run`) —
  # cuts the next version from main's current HEAD, exactly like a push
  # would.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history in the object database — the same
          # `fetch-depth: 0` idiom the factory workflow's own stage
          # jobs use: the notes' range base is the predecessor
          # release's tag, and `git describe` can name it only where
          # the tag is fetched. A shallow checkout would name no tag
          # and fall back to "the first commit," which its shallow
          # clone reports as HEAD itself — an empty diff behind it —
          # and full history is also what puts the *real* first
          # commit at a first release's range base.
          fetch-depth: 0
      - name: Gate publication on version consistency
        # A published version is the factory workflow file and its
        # runtime tree as one — the one-ref-is-one-version mechanism the
        # consumer's single uses: pin relies on. The flow itself must
        # never push a commit that updates a workflow file (the
        # `workflows` scope the App cannot be granted) — so the
        # flow's part of the version is read-only: gate publication on
        # the committed version's consistency. A tagged commit whose
        # version is not consistent — (a) the file is not plain text,
        # storing a binary payload; (b) the file exceeds 500kb, the max
        # allowed size for it; or (c) the tagged commit's tree carries
        # no runtime tree the file's stage steps execute — must not be
        # published: fail here, before the tag, with the exact cause.
        run: |
          python3 .github/scripts/embed-runtime.py --check || {
            echo "::error::the published version is not consistent — the committed factory.yml is not plain text within the max allowed size, or the tagged commit's tree does not carry the runtime tree the file's stage steps execute: an inconsistent version must not be published"
            exit 1
          }
      - name: Gate publication on the workflow file's structure
        # A published version must also be structurally safe: a file a
        # standard engine cannot parse, a step that declares keys after
        # its run block (the dedent that ends the block inside the step
        # mapping — the shape the runner's workflow parser diverges on),
        # a run block past the giant-body budget, a run block whose
        # heredoc terminator the block's dedent leaves off column 0 in
        # the executed script (bash reads the rest of the step's script
        # as the heredoc's body — the step dies at run time while the
        # run's job graph stands: runs #151/#152's trigger failure,
        # issue #112), a run block whose `python3` code-heredoc body
        # the block's dedent leaves indented (a program's first line at
        # a nonzero column is an IndentationError the interpreter dies
        # on: run #165's stage 12 failure — the #112 terminator fix
        # left the body four deeper inside the console-mirror subshell),
        # or a run block that opens a heredoc it never terminates —
        # would publish a version whose jobs the runner
        # mis-parses or whose steps die at run time: the run's job
        # graph collapses (issue #106 — a stage job missing from the
        # graph, phantom steps in every other job, the stage outcomes
        # lost). The gate fails before the tag, with the exact cause,
        # on the committed file.
        run: |
          python3 .github/scripts/embed-runtime.py --verify-structure || {
            echo "::error::the published version's workflow file is not parser-safe — a standard engine rejects it, a step declares keys after its run block, a run block exceeds the giant-body budget, a run block's heredoc terminator is indented past the block's base, a `python3` code-heredoc body is indented past the block's base, or a block opens a heredoc it never terminates: a version whose jobs the runner mis-parses or whose steps die at run time must not be published"
            exit 1
          }
      - id: consumer-only
        name: Skip a push that changes only the consumer workflow
        # A version is the factory workflow and its runtime tree as one
        # published version — never the consumer's own workflow file
        # (.github/workflows/code-weaver.yml, the target's only
        # per-target code): a push whose changed files are confined to
        # it changes nothing a published version carries, so it must
        # spend no release number. The shared-plumbing helper's
        # changed-files shape answers that — one changed file name per
        # line on stdin, non-empty output the skip signal (the same
        # empty/non-empty distinction the one-tag-per-commit guard in
        # the Publish step reads). The push's base is the event's
        # `before` sha — a push that creates the branch carries the zero
        # sha, where the first commit is the base. A workflow_dispatch
        # re-run is not a push (it has no `before` sha) and skips this
        # check: its no-op protection stays the one-tag-per-commit guard
        # in the Publish step (a re-run at an unchanged HEAD publishes
        # nothing). The skip's channel: the step writes its skip signal
        # to a step output (`should_skip`) the Publish step's `if:`
        # reads — a step's zero exit ends that step only, and a step
        # exit never stops the job (the flow's next step runs
        # regardless), so the skip cannot be the exit itself; the
        # output is what keeps the Publish step from running.
        run: |
          # the skip signal the Publish step's if: reads — written for
          # every shape (the default is publish; a consumer-workflow-only
          # push overwrites it below, and the last write to a step
          # output wins)
          echo "should_skip=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ZERO=0000000000000000000000000000000000000000
            if [ -z "$GITHUB_EVENT_BEFORE" ] || [ "$GITHUB_EVENT_BEFORE" = "$ZERO" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            else
              BASE="$GITHUB_EVENT_BEFORE"
            fi
            CHANGED=$(git diff --name-only "$BASE" HEAD)
            SKIP=$(printf '%s\n' "$CHANGED" | python3 .github/scripts/release-number.py --changed-files)
            if [ -n "$SKIP" ]; then
              echo "the push changes only $SKIP — a published version is the factory workflow and its runtime tree as one published version, never the consumer's own workflow file: the Publish step's if: reads this step's output and skips — no release is published and no number is spent"
              echo "should_skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
      - name: Publish the release
        # The step runs only where the pre-publish check above did not
        # skip: a push whose changed files are confined to the
        # consumer's own workflow file changes nothing a published
        # version carries, and the skip is a step output this step's
        # if: reads (a step's zero exit ends that step only — it never
        # stops the job, so the output is what keeps this step from
        # running: no number spent on a version whose content did not
        # change). A workflow_dispatch re-run writes no skip — its
        # no-op protection stays the one-tag-per-commit guard below.
        if: ${{ steps.consumer-only.outputs.should_skip != 'true' }}
        env:
          # the gh CLI refuses to run in an Actions job unless GH_TOKEN is
          # set (no GITHUB_TOKEN fallback); the github.token context is the
          # same default token that pushes the tag — still no secret
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag is the next single increasing number: the number after
          # the highest published version of the new scheme (no published
          # number yet → 1). The shared-plumbing helper
          # (`.github/scripts/release-number.py`) does the computation —
          # its pure function is unit-tested by
          # tests/test_release_contract.py. Older-scheme tags are not
          # numbers, so they stay out of the series: published version
          # numbers never repeat and never decrease.
          TAGS=$(git ls-remote --tags origin \
            | awk -F'\t' 'substr($2, length($2)-2) != "^{}" { sub(/^refs\/tags\//, "", $2); print $2 }')
          NEXT=$(printf '%s\n' "$TAGS" | python3 .github/scripts/release-number.py)
          # The notes' range base is the predecessor release — the
          # closest reachable tag of the new scheme. `--match '[0-9]*'`
          # restricts the describe to that series: every new-scheme
          # tag is a bare integer (no `v` prefix, no dots — the scheme
          # the helper defines) and so starts with a digit, while every
          # older `v`-prefixed semver tag stays out — an older tag can
          # never name the reference.
          PREV=$(git describe --match '[0-9]*' --tags --abbrev=0 2>/dev/null || true)
          # A release with no predecessor: the range base is the first
          # commit — the dichotomy the notes keep; the full-history
          # checkout above makes it the real first commit (a shallow
          # fetch would report HEAD itself).
          RANGEFROM=${PREV:-$(git rev-list --max-parents=0 HEAD)}
          # The #79 contract, payload-independent: the pre-publish
          # skip reads the push event's metadata, which a run is not
          # bound to hand over as the helper expects — a payload that
          # skip did not read as consumer-only must not spend a number
          # where a published version's content did not change. The
          # same changed-files predicate, asked over the committed
          # tree (this advance's range base → HEAD): confined to the
          # consumer's own workflow file, the version is unchanged
          # and the step exits before the tag — no number materialised,
          # no tag created, no release published, no number spent
          CONSUMER_ONLY=$(git diff --name-only "$RANGEFROM" HEAD \
            | python3 .github/scripts/release-number.py --changed-files)
          if [ -n "$CONSUMER_ONLY" ]; then
            echo "the range ${RANGEFROM}..HEAD changes only $CONSUMER_ONLY — a published version is the factory workflow and its runtime tree as one published version, never the consumer's own workflow file: no release is published and no number is spent"
            exit 0
          fi
          # The notes' changelog is a table with one row per commit in
          # the branch since the range base — the whole range, no
          # pathspec subset of it: a push that changes files elsewhere
          # (docs, README, tests, …) still publishes, and the table
          # must name the real changes, never print empty. Each row
          # carries the commit's title, its author, its hash and its
          # datetime. The commit's fields are separated by
          # unit-separator bytes (a commit field can carry a pipe, but
          # never that byte), which the awk below turns into the
          # table's rows, escaping the pipes a text field can carry;
          # the table's header prints even where the range is empty,
          # so the notes' changelog is never the empty string.
          CHANGES=$(git log "$RANGEFROM"..HEAD \
            --pretty=format:'%s%x1f%an%x1f%h%x1f%ad' --date=iso | \
            awk 'BEGIN { FS = "\037"; print "| Title | Author | Hash | Datetime |";
                          print "|---|---|---|---|" }
                 { gsub(/\|/, "\\\\&", $1); gsub(/\|/, "\\\\&", $2);
                   printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }')

          # One tag per commit: a re-run of this flow at an unchanged
          # HEAD (a workflow-dispatch retry) would otherwise spend the
          # next number on a duplicate of a version already published —
          # and a consumer pin written for the next number would land on
          # the duplicate instead of on the change. A HEAD any numbered
          # tag already points at publishes nothing: the version series
          # advances only when main does. (The helper's guard shape:
          # raw tag lines on stdin, the matching numbered tags on stdout,
          # non-empty → skip.)
          ALREADY=$(git ls-remote --tags origin \
            | python3 .github/scripts/release-number.py --published-at "$(git rev-parse HEAD)")
          if [ -n "$ALREADY" ]; then
            echo "HEAD $(git rev-parse --short HEAD) is already published as $(printf '%s' "$ALREADY" | tr '\n' ' ') — a re-run of the release at an unchanged HEAD publishes nothing (one tag per commit)"
            exit 0
          fi

          # The tag points at main's HEAD — the commit this push delivered,
          # already on the remote. The push uploads only the tag object
          # (no new commit content), so the default GITHUB_TOKEN publishes
          # it with `contents: write` — no special token, no secret. A
          # branch is never pushed (a push to main would re-trigger this
          # workflow and cascade the next release) — the tag is the only
          # ref the flow publishes.
          git tag "$NEXT" HEAD
          git push origin "refs/tags/$NEXT"
          NOTES=$(printf '## %s\n\nChanged since %s:\n\n%s\n\n**Consumers:** bump the ref in your `code-weaver.yml` to `@%s` to upgrade. Older pinned refs remain valid — every published version is a stable ref.\n' "$NEXT" "${PREV:-the first commit}" "$CHANGES" "$NEXT")
          gh release create "$NEXT" --title "code-weaver $NEXT" --notes "$NOTES"
