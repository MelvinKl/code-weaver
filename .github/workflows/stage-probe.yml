# Temporary probe: run the extract stage exactly as the factory does;
# full trace + resulting tree in an artifact
name: stage-probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          token: $\{\{ secrets.GH_TOKEN \}\}
          ref: main
      - name: Run the extract stage (factory env)
        env:
          GH_TOKEN: $\{\{ secrets.GH_TOKEN \}\}
          LLM_MODEL: Qwen3.8
          TARGET_BRANCH: main
          REQUIREMENTS_DIR: requirements
          PLAN_DIR: plan
          DOC_DIR: doc
          MAX_LOOPS: 5
          MAX_TOKENS: 500000
        run: |
          echo "GITHUB_ACTION_PATH=[$GITHUB_ACTION_PATH]"
          T="$RUNNER_TEMP/cw/state/trigger"
          mkdir -p "$T"
          echo true > "$T/started.txt"
          echo 3 > "$T/issue-number.txt"
          echo "Merge PR target branch into feature branch before the final action check" > "$T/issue-title.txt"
          echo main > "$T/base-ref.txt"
          git rev-parse HEAD > "$T/base-sha.txt"
          echo "ai/code-weaver/3" > "$T/head.txt"
          echo main > "$T/base.txt"
          echo "" | base64 -d > "$RUNNER_TEMP/cw/issue-body.md"
          {
            echo "=== extract stage run (exit will end the job) ==="
            python3 .github/actions/extract-stage/stage.py 2>&1 | tail -60
            echo "stage-exit=${PIPESTATUS[0]}"
          } > /tmp/trace.txt 2>&1
          tail -8 /tmp/trace.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-trace
          path: /tmp/trace.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-tree
          path: |
            $\{\{ runner.temp \}\}/cw
            requirements
