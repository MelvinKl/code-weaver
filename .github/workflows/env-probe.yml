# Temporary probe v2: does GITHUB_ENV survive across a middle step
# (write -> no-op -> read), matching the factory's state-step topology?
name: env-probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: S1 write GITHUB_ENV
        run: |
          echo "PROBE_ONE=alpha" >> "$GITHUB_ENV"
          echo "s1: file=[$(cat "$GITHUB_ENV" 2>/dev/null)]"
      - name: S2 no-op middle step
        run: echo "s2: sees PROBE_ONE=[$PROBE_ONE]"
      - name: S3 read back (bash + python)
        run: |
          echo "s3 bash sees PROBE_ONE=[$PROBE_ONE]"
          echo "s3 python sees PROBE_ONE=[$(python3 -c 'import os;print(os.environ.get("PROBE_ONE","<ABSENT>"))')]"
