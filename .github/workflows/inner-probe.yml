# Temporary probe: call the inner-probe composite action and let the
# extract stage run through a composite inner step, exactly as the
# factory does
name: inner-probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Inner-step variable dump
        uses: ./.github/actions/inner-probe/
      - name: Inner-step stage-path check (no stage run — keep the run green)
        uses: ./.github/actions/inner-probe/
        id: check2
