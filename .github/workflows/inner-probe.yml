# Temporary probe: call the inner-probe composite action and let the
# extract stage run through a composite inner step, exactly as the
# factory does
name: inner-probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Inner-step variable dump
        uses: ./.github/actions/inner-probe/
      - name: Set up synthetic trigger state for the stage
        run: |
          T="$RUNNER_TEMP/cw/state/trigger"
          mkdir -p "$T"
          echo true > "$T/started.txt"
          echo 3 > "$T/issue-number.txt"
          echo "Merge PR target branch into feature branch before the final action check" > "$T/issue-title.txt"
          echo main > "$T/base-ref.txt"
          git rev-parse HEAD > "$T/base-sha.txt"
          echo "ai/code-weaver/3" > "$T/head.txt"
          echo main > "$T/base.txt"
      - name: Run the extract stage through a composite inner step
        id: innerstage
        uses: ./.github/actions/extract-stage/
        with:
          llm-model: Qwen3.8
          target-branch: main
          requirements-dir: requirements
          plan-dir: plan
          doc-dir: doc
          max-loops: 5
          max-tokens: "500000"
        env:
          LLM_MODEL: Qwen3.8
          TARGET_BRANCH: main
          REQUIREMENTS_DIR: requirements
          PLAN_DIR: plan
          DOC_DIR: doc
          MAX_LOOPS: 5
          MAX_TOKENS: 500000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-cw
          path: ${{ runner.temp }}/cw
