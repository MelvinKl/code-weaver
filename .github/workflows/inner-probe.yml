# Temporary probe: call the inner-probe composite action and let the
# extract stage run through a composite inner step, exactly as the
# factory does
name: inner-probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Inner-step variable dump
        uses: ./.github/actions/inner-probe/
      - name: Run the extract stage exactly as the factory (console captured)
        uses: ./.github/actions/stage-capture/
        env:
          LLM_MODEL: Qwen3.8
          TARGET_BRANCH: main
          REQUIREMENTS_DIR: requirements
          PLAN_DIR: plan
          DOC_DIR: doc
          MAX_LOOPS: 5
          MAX_TOKENS: 500000
          AI_BRANCH: ai/code-weaver/3
          ISSUE_NUMBER: "3"
          BASELINE_REF: ""
          CW_AI_BRANCH: ai/code-weaver/3
          CW_ISSUE_NUMBER: "3"
          CW_BASE_SHA: ""
