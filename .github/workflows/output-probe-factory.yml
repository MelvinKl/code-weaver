name: output-probe
on:
  workflow_call:
    inputs:
      ping:
        type: string
        default: ""

jobs:
  one:
    runs-on: self-hosted
    outputs:
      started: ${{ steps.w.outputs.started }}
      single: ${{ steps.w.outputs.single }}
      first: ${{ steps.w.outputs.first }}
      last: ${{ steps.w.outputs.last }}
      v4: ${{ steps.w.outputs.v4 }}
    steps:
      - id: w
        run: |
          echo "started=false" >> "$GITHUB_OUTPUT"
          echo "single=alpha" >> "$GITHUB_OUTPUT"
          echo "first=one" >> "$GITHUB_OUTPUT"
          echo "started=true" >> "$GITHUB_OUTPUT"
          echo "last=two" >> "$GITHUB_OUTPUT"
          echo "v4=from-job-outputs" >> "$GITHUB_OUTPUT"
      - name: dump github_output file
        run: |
          echo "=== GITHUB_OUTPUT file after step ==="
          cat "$GITHUB_OUTPUT"
          echo "=== end ==="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-step3
          path: ${{ runner.temp }}/probe-outputs.txt
          if-no-files-found: ignore

  two:
    runs-on: self-hosted
    needs: one
    steps:
      - uses: ./.github/actions/inputs-echo/
        with:
          p: ${{ needs.one.outputs.v4 }}
          q: literal-q
          r: ${{ inputs.ping }}
      - name: job-two dump
        run: |
          cp "$RUNNER_TEMP/inputs-echo.txt" "$RUNNER_TEMP/probe-outputs.txt" 2>/dev/null || true
          cat "$RUNNER_TEMP/probe-outputs.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: ${{ runner.temp }}/probe-outputs.txt
          if-no-files-found: warn
      - name: echo received outputs
        run: |
    steps:
      - name: echo received outputs
