# Temporary probe: dump how the standard runner vars look INSIDE a
# composite action's inner steps on this runner build
name: inner-probe (temporary)
description: dump inner-step env for the stage run-line diagnosis
runs:
  using: "composite"
  steps:
    - name: Dump the inner-step environment
      shell: bash
      run: |
        {
          echo "cwd=$(pwd)"
          echo "GITHUB_WORKSPACE=[$GITHUB_WORKSPACE]"
          echo "GITHUB_ACTION_PATH=[$GITHUB_ACTION_PATH]"
          echo "GITHUB_PATH=[$GITHUB_PATH]"
          echo "RUNNER_TEMP=[$RUNNER_TEMP]"
          echo "RUNNER_OS=[$RUNNER_OS]"
          for v in GITHUB_API_URL GITHUB_SERVER_URL GITHUB_EVENT_NAME CI GITHUB_ACTIONS; do
            echo "$v=[$!v]"
          done
          S="${GITHUB_ACTION_PATH}/stage.py"
          echo "AP-derived S=[$S] exists=$([ -f "$S" ] && echo yes || echo no)"
          S2="$GITHUB_WORKSPACE/.github/actions/extract-stage/stage.py"
          echo "WS-derived S2=[$S2] exists=$([ -f "$S2" ] && echo yes || echo no)"
          ls .github/actions/ 2>&1 | head -8
          echo "=== stage run-line simulation ==="
          S="${GITHUB_ACTION_PATH}/stage.py"
          [ -f "$S" ] || S="$GITHUB_WORKSPACE/.github/actions/extract-stage/stage.py"
          echo "resolved S=[$S]"
          [ -f "$S" ] && echo "S exists: yes" || echo "S exists: NO"
          head -25 "$S" 2>&1 | head -26
        } > /tmp/inner-probe.txt 2>&1
        echo "dump done: $(wc -l < /tmp/inner-probe.txt) lines"
    - name: Upload the dump
      uses: actions/upload-artifact@v4
      with:
        name: inner-probe
        path: /tmp/inner-probe.txt
        if-no-files-found: error
