name: implement-stage
description: >-
  Stages 8+9 — implementation + implement check, one bounded loop: pi
  implements the plan(s) as code, generates tests, keeps the arc42 markdown
  (doc dir) complete and the README current; the shared guard allows code,
  tests, docs and README — never the requirements (or plans): a leak there
  loops back to the plan stage (stage 6) before implementing again.
runs:
  using: composite
  steps:
    - name: Record the stage baseline (the branch tip as this stage started)
      # The guard judges THIS stage's work only: earlier stages' committed
      # outputs must not look like off-limits changes against the trigger's
      # base sha.
      run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
    - name: Implementation loop (bounded by MAX_LOOPS / MAX_TOKENS; 0 = no cap)
      shell: bash
      working-directory: ${{ github.workspace }}
      # GITHUB_ACTION_PATH is unreliable inside composite inner
      # steps on this runner build (unset or mis-pointed), so the
      # run line verifies its target and falls back to the
      # checkout-relative action path — a healthy runner resolves
      # the var to the same directory anyway
      run: |-
        S="${GITHUB_ACTION_PATH}/stage.py"
        [ -f "$S" ] || S="$GITHUB_WORKSPACE/.github/actions/implement-stage/stage.py"
        python3 "$S"
