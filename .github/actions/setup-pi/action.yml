name: setup-pi
description: >-
  Stage 2 — install pi for this workflow run and configure it from the
  run's provided harness. The harness is provided per run: the model
  configuration via a GitHub secret or the repo file .pi/agent/models.json
  (the backend in it is the run's LLM backend), the additional packages via
  a GitHub secret or .pi/settings.json (an empty or absent provider leaves
  pi without additional packages), the MCP configuration via an optional
  GitHub secret or .pi/mcp.json, and the extension's environment variables
  (such as the ones .pi/extensions/pi-jev-config.ts carries) via a
  .env-style GitHub secret. The stage installs pi so every later pi
  invocation in the run uses that installed copy, materialises the harness
  into the agent directory the run's pi invocations resolve
  (~/.pi/agent/, or PI_CODING_AGENT_DIR — replacing the runner's
  pre-existing user-level configuration for the run), and verifies the
  result: backend reachability → model in the written set → a headless
  pi --print smoke check on the installed pi. A setup that cannot install or
  configure pi fails the stage with an explicit message — no later stage
  runs. pi is not a pre-requisite of the runner environment.
inputs:
  llm-model:
    description: Which configured model the run uses (must be listed in the model set of the run's provided model configuration)
    required: false
    default: Ornith-1.5-35B-A3B
  # The run's pi harness providers (the factory's four harness secrets ride
  # here): each carries the full content of the named element — an empty
  # value means "no provider for this element" and the stage resolves the
  # repo file instead. The factory delivers them with: + CW_<name> env per
  # its documented relay idiom; the stage code consumes them as INPUT_*
  # falling back to CW_*.
  pi-models:
    description: The run's model configuration — the content of .pi/agent/models.json (empty = the repo file is the provider)
    required: false
  pi-settings:
    description: The run's additional-packages settings — the content of .pi/settings.json (empty = pi without additional packages)
    required: false
  pi-mcp:
    description: The run's MCP configuration — the content of .pi/mcp.json (empty = the run's pi runs without MCP servers)
    required: false
  pi-extension-env:
    description: The pi extension's environment variables in .env style (empty = no provider for the extension's environment)
    required: false
runs:
  using: composite
  steps:
    - id: verify
      name: Stage 2 — install pi for the run, configure it from the provided harness
      # shell: is declared on every script step — this runner build's
      # manifest loader rejects a composite step that has run: but no
      # shell: (v2.338: "Required property is missing: shell").
      shell: bash
      working-directory: ${{ github.workspace }}
      # GITHUB_ACTION_PATH is unreliable inside composite inner
      # steps on this runner build (unset or mis-pointed), so the
      # run line verifies its target and falls back to the
      # checkout-relative action path — a healthy runner resolves
      # the var to the same directory anyway. Step-level env: this
      # runner build does not propagate job-level values into a
      # composite action's inner steps.
      env:
        LLM_MODEL: ${{ inputs.llm-model }}
      run: |-
        S="${GITHUB_ACTION_PATH}/stage.py"
        [ -f "$S" ] || S="$GITHUB_WORKSPACE/.github/actions/setup-pi/stage.py"
        python3 "$S"
outputs:
  backend-url:
    value: ${{ steps.verify.outputs.backend-url }}
  model:
    value: ${{ steps.verify.outputs.model }}
  pi-install-dir:
    value: ${{ steps.verify.outputs.pi-install-dir }}
