name: plan-stage
description: >-
  Stages 6+7 — planning + plan check, one bounded loop: pi writes markdown
  plan(s) under the plan dir from the requirements and the arc42
  documentation — one or more files, combining changes, but covering EVERY
  requirement change, grounded in the documented architecture; the shared
  guard verifies only the plan dir changed (a leak reverts + re-runs).
runs:
  using: composite
  steps:
    - name: Record the stage baseline (the branch tip as this stage started)
      # The guard judges THIS stage's work only: earlier stages' committed
      # outputs must not look like off-limits changes against the trigger's
      # base sha.
      # shell: is declared on every script step — this runner build's
      # manifest loader rejects a composite step that has run: but no
      # shell: (v2.338: "Required property is missing: shell").
      shell: bash
      run: git rev-parse HEAD > "$RUNNER_TEMP/cw/stage-baseline.sha"
    - name: Plan loop (bounded by MAX_LOOPS / MAX_TOKENS; 0 = no cap)
      shell: bash
      working-directory: ${{ github.workspace }}
      # GITHUB_ACTION_PATH is unreliable inside composite inner
      # steps on this runner build (unset or mis-pointed), so the
      # run line verifies its target and falls back to the
      # checkout-relative action path — a healthy runner resolves
      # the var to the same directory anyway
      run: |-
        S="${GITHUB_ACTION_PATH}/stage.py"
        [ -f "$S" ] || S="$GITHUB_WORKSPACE/.github/actions/plan-stage/stage.py"
        python3 "$S"
