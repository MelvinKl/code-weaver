name: guard-check
description: >-
  The one shared "only X changed" guard idiom (plan §4.1, in Python per the
  owner's scripting preference): given the baseline ref and the stage's
  allowed paths, every file in the baseline diff outside those paths is
  reverted exactly, and the action exits 1 so the caller re-runs the
  generation stage. A single script, invoked three times with different
  allowed paths — after requirement-extraction (stage 5), after plan (stage
  7) and after implementation (stage 9).
inputs:
  baseline-ref:
    description: Baseline ref (sha or branch) the stage started from
    required: true
  allow:
    description: >-
      Space-separated allowed paths for this stage (e.g. "requirements",
      "plans", "docs README.md" or "src tests docs README.md")
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Guard — only the allowed paths may change
      shell: /usr/bin/env python3 {0}  # bare "python3" is not a runner-accepted shell form
      working-directory: ${{ github.workspace }}
      env:
        BASELINE_REF: ${{ inputs.baseline-ref }}
        CW_GUARD_ALLOW: ${{ inputs.allow }}
      run: |
        import os, sys, subprocess
        # a crashed stage must leave a persistent diagnosis (the job log dies
        # with the run; a ghost run's logs are unreachable from the API) —
        # the full traceback goes to the runner's diag dir + one line to the
        # stage-fail-reason state file the summary/upload steps carry on
        def _cw_on_uncaught(t, v, tb):
            import traceback as _tb
            dump = _tb.format_exc()
            try:
                d = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "cw")
                os.makedirs(d, exist_ok=True)
                with open(os.path.join(d, "stage-fail-reason.txt"), "w") as f:
                    f.write(f"stage guard-check FAILED — {v}\n")
                with open("/opt/actions-runner/_diag/cw-diag.log", "a") as f:
                    f.write(f"=== stage guard-check FAILED ===\n{dump}\n")
                print(f"::error::stage guard-check failed — full diagnosis: /opt/actions-runner/_diag/cw-diag.log")
            except Exception:
                print(f"::error::stage guard-check failed — {v}")
            raise SystemExit(1)
        sys.excepthook = _cw_on_uncaught
        script = os.path.join(os.environ.get("GITHUB_ACTION_PATH", "."), "guard-check.py")
        args = [sys.executable, script, os.environ["BASELINE_REF"], *os.environ.get("CW_GUARD_ALLOW", "").split()]
        r = subprocess.run(args, cwd=os.environ["GITHUB_WORKSPACE"], env=os.environ)
        sys.exit(r.returncode)
