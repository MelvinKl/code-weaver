# Temporary probe: run the extract stage exactly as the factory does, but
# capture its console straight into the persistent runner diag dir
name: stage-capture (temporary)
description: tee the stage console to the runner diag dir (never fails)
runs:
  using: "composite"
  steps:
    - name: Run the stage with the console captured
      shell: bash
      run: |
        set +e
        python3 "$GITHUB_WORKSPACE/.github/actions/extract-stage/stage.py" \
          > /opt/actions-runner/_diag/probe-console.txt 2>&1
        echo "stage-exit=$?" >> /opt/actions-runner/_diag/probe-console.txt
        echo "captured $(wc -l < /opt/actions-runner/_diag/probe-console.txt) lines"
        exit 0
    - name: Upload the captured console + state
      uses: actions/upload-artifact@v4
      with:
        name: probe-stage-console
        path: ${{ runner.temp }}/cw
        if-no-files-found: warn
